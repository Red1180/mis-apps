<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Colonia</title>
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Colonia">
<meta name="theme-color" content="#0c1410">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>%F0%9F%8F%95%EF%B8%8F</text></svg>">
<style>
/* ==================== TOKENS ==================== */
:root{
  --ink:#120d22;
  --panel:rgba(17,13,30,.9);
  --panel-2:rgba(255,255,255,.06);
  --line:rgba(255,255,255,.14);
  --text:#fff;
  --soft:#efe6ff;
  --muted:#c9bce8;
  --label:#ffd98a;
  --red:#cc3d22; --red-d:#86240f;
  --gold:#f6b02c; --gold-d:#b47a10;
  --teal:#13806c; --teal-d:#0a4a3f;
  --blue:#3f63cf; --blue-d:#263f8f;
  --purple:#8a52c8; --purple-d:#5a2499;
  --dark:#3a2d5c; --dark-d:#211735;
  --good:#3ddc97; --bad:#ff7b88; --warn:#f6b02c;
  --input:#1b1238;
  --n-hogar:#3fbf8f; --n-comida:#f0a03a; --n-higiene:#4ea8ff; --n-cuerpo:#e070c0; --mood:#8fb3ff;
  --hero-font:'Segoe UI Black','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
body{margin:0;min-height:100vh;font-family:'Segoe UI','Trebuchet MS',Verdana,system-ui,sans-serif;color:var(--text);background:#0c1410;overflow-x:hidden}
button{font-family:inherit;-webkit-user-select:none;user-select:none}
input,select,textarea{font-family:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#bg{position:fixed;inset:0;width:100vw;height:100vh;image-rendering:pixelated;z-index:0}
#vignette{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 40%, transparent 30%, rgba(6,4,14,.78) 100%)}
#crt{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.08;background:repeating-linear-gradient(0deg, rgba(0,0,0,.55) 0 2px, transparent 2px 4px)}
#app{position:relative;z-index:2}

/* ==================== BOTONES ==================== */
.btn{position:relative;border:none;cursor:pointer;font-weight:900;letter-spacing:.4px;color:#fff;padding:.65em 1.25em;border-radius:13px;font-size:1rem;
  background:var(--red);box-shadow:0 5px 0 var(--red-d),0 9px 16px rgba(0,0,0,.4);text-shadow:0 2px 0 rgba(0,0,0,.3);
  transition:transform .08s,box-shadow .08s,filter .15s}
.btn:hover{transform:translateY(-2px) rotate(-.6deg)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--red-d),0 3px 8px rgba(0,0,0,.4)}
.btn.teal{background:var(--teal);box-shadow:0 5px 0 var(--teal-d),0 9px 16px rgba(0,0,0,.4)}
.btn.teal:active{box-shadow:0 1px 0 var(--teal-d)}
.btn.gold{background:var(--gold);color:#3a2503;text-shadow:0 1px 0 rgba(255,255,255,.35);box-shadow:0 5px 0 var(--gold-d),0 9px 16px rgba(0,0,0,.4)}
.btn.gold:active{box-shadow:0 1px 0 var(--gold-d)}
.btn.blue{background:var(--blue);box-shadow:0 5px 0 var(--blue-d),0 9px 16px rgba(0,0,0,.4)}
.btn.purple{background:var(--purple);box-shadow:0 5px 0 var(--purple-d),0 9px 16px rgba(0,0,0,.4)}
.btn.purple:active{box-shadow:0 1px 0 var(--purple-d)}
.btn.dark{background:var(--dark);box-shadow:0 5px 0 var(--dark-d),0 9px 16px rgba(0,0,0,.4)}
.btn.dark:active{box-shadow:0 1px 0 var(--dark-d)}
.btn.big{font-size:1.15rem;padding:.8em 1.5em;border-radius:16px}
.btn.sm{font-size:.85rem;padding:.48em .9em;border-radius:10px;box-shadow:0 4px 0 var(--red-d)}
.btn.sm.teal{box-shadow:0 4px 0 var(--teal-d)}
.btn.sm.gold{box-shadow:0 4px 0 var(--gold-d)}
.btn.sm.dark{box-shadow:0 4px 0 var(--dark-d)}
.btn.sm.purple{box-shadow:0 4px 0 var(--purple-d)}
.btn.sm.blue{box-shadow:0 4px 0 var(--blue-d)}
.btn:disabled{filter:grayscale(.8) brightness(.6);cursor:default;transform:none}
.btn small{display:block;font-size:.62em;font-weight:700;opacity:.85;letter-spacing:0}
.btn.armed{background:#c22c3e !important;color:#fff !important;box-shadow:0 5px 0 #7a1622 !important}
.link-btn{background:none;border:none;color:var(--gold);font-weight:800;cursor:pointer;padding:6px 0;font-size:.92rem;text-decoration:underline;text-underline-offset:3px;align-self:flex-start}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:.9rem;padding:.42em .95em;border-radius:999px;cursor:pointer;border:2px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);color:#fff;font-weight:800;transition:transform .08s}
.chip:hover{transform:translateY(-2px)}
.chip.sel{background:var(--gold);color:#3a2503;border-color:rgba(255,255,255,.25);box-shadow:0 3px 0 var(--gold-d)}
.seg{display:flex;gap:6px;flex-wrap:wrap;background:rgba(0,0,0,.3);padding:5px;border-radius:14px;width:fit-content;max-width:100%}
.seg button{border:none;background:transparent;color:var(--soft);font-weight:900;padding:.5em 1.05em;border-radius:10px;cursor:pointer;font-size:.95rem}
.seg button.on{background:var(--gold);color:#3a2503;box-shadow:0 3px 0 var(--gold-d)}

/* ==================== BARRA SUPERIOR ==================== */
#topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px max(14px,calc((100vw - 1150px) / 2));background:rgba(12,9,24,.95);border-bottom:2px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;cursor:pointer;flex-shrink:0;background:none;border:none;padding:0;color:inherit}
.logo-e{font-size:1.9rem;display:inline-block;animation:wiggle 3s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg) translateY(-3px)}}
#title{display:flex;font-family:'Arial Black','Segoe UI',sans-serif;font-size:1.55rem;font-weight:900;letter-spacing:1px;line-height:1}
#title .letter{display:inline-block;-webkit-text-stroke:1.5px var(--ink);text-shadow:0 3px 0 var(--ink);animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-4px) rotate(3deg)}}
#nav{display:flex;gap:6px;margin-left:auto}
.navb{border:none;cursor:pointer;color:#fff;font-weight:900;font-size:.93rem;padding:.55em .85em;border-radius:12px;background:var(--dark);box-shadow:0 4px 0 var(--dark-d);display:flex;align-items:center;gap:6px;transition:transform .08s}
.navb:hover{transform:translateY(-2px)}
.navb.on{background:var(--gold);color:#3a2503;box-shadow:0 4px 0 var(--gold-d)}
.navb i{font-style:normal;font-size:1.1rem}
.top-r{display:flex;gap:8px;align-items:center;flex-shrink:0}
.colchip{display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:rgba(255,255,255,.06);border-radius:14px;padding:4px 10px 4px 4px;cursor:pointer;color:#fff;text-align:left}
.colchip:hover{border-color:rgba(255,255,255,.35)}
.colchip .av{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.35rem;background:#2a2047;border:2px solid var(--gold);flex-shrink:0}
.colchip b{display:block;font-size:.85rem;line-height:1.15;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.colchip small{display:block;font-size:.72rem;color:var(--muted);font-weight:700;white-space:nowrap}
@media (max-width:1100px){#title,.top-r .hide-s,.colchip .ct{display:none}.colchip{padding:3px}.navb{padding:.5em .65em}}
@media (max-width:760px){
  #topbar{padding:8px 10px;gap:8px}
  #title{font-size:1.2rem}
  .logo-e{font-size:1.5rem}
  #nav{position:fixed;left:0;right:0;bottom:0;margin:0;padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);gap:5px;background:rgba(12,9,24,.97);border-top:2px solid var(--line);z-index:20}
  .navb{flex-direction:column;gap:2px;font-size:.72rem;padding:.4em .1em}
  .navb span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .top-r{margin-left:auto}
  .hide-s{display:none}
}

/* ==================== LAYOUT ==================== */
main{width:min(1150px,calc(100% - 24px));margin:0 auto;padding:16px 0 120px}
body.has-work main{padding-bottom:200px}
@media (max-width:760px){main{padding-bottom:170px}body.has-work main{padding-bottom:250px}}
.tab{display:none;flex-direction:column;gap:16px}
.tab.active{display:flex;animation:tabIn .25s ease both}
@keyframes tabIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:16px 18px;box-shadow:0 14px 30px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.07)}
.panel h3{margin:0 0 4px;font-size:1.15rem;font-weight:900;color:var(--label);text-shadow:0 2px 0 rgba(0,0,0,.5)}
.sub{margin:0 0 12px;color:var(--muted);font-size:.86rem;line-height:1.4}
.muted{color:var(--muted);font-size:.9rem;line-height:1.45;margin:0}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
h2.scr{margin:0;font-family:'Arial Black','Segoe UI',sans-serif;font-size:1.55rem;-webkit-text-stroke:1px var(--ink);text-shadow:0 4px 0 var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.empty{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding:22px}
.empty .big-e{font-size:2.8rem}
.empty p{margin:0;color:var(--soft);max-width:460px;line-height:1.5}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bar{position:relative;height:12px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;transition:width .6s}
.bar .tick{position:absolute;top:0;bottom:0;width:2px;background:rgba(0,0,0,.6)}
.st-ok{background:var(--good)} .st-mid{background:var(--warn)} .st-bad{background:var(--bad)}
.tx-ok{color:#9ff0c8} .tx-mid{color:#ffe08a} .tx-bad{color:#ffb3a8}
.pill{font-size:.72rem;font-weight:800;border-radius:99px;padding:.18em .6em;background:rgba(255,255,255,.1);color:var(--soft);white-space:nowrap}
.meta{display:flex;gap:6px;flex-wrap:wrap}

/* ==================== HOY: COLONO ==================== */
.colstrip{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1.3fr);gap:18px;align-items:center;cursor:pointer}
.colstrip:hover{border-color:rgba(255,255,255,.3)}
.portrait{position:relative;width:84px;height:84px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:3rem;background:radial-gradient(circle at 50% 35%,#3a2d63,#17112b);border:3px solid var(--gold);box-shadow:0 6px 0 rgba(0,0,0,.35);flex-shrink:0}
.portrait .lvl{position:absolute;bottom:-11px;left:50%;transform:translateX(-50%);background:var(--gold);color:#3a2503;font-weight:900;font-size:.72rem;border-radius:99px;padding:.12em .6em;white-space:nowrap}
.portrait .insp{position:absolute;top:-12px;right:-12px;font-size:1.3rem;animation:wiggle 1.5s infinite}
.cs-name{font-size:1.3rem;font-weight:900;overflow-wrap:anywhere;line-height:1.2}
.cs-title{color:var(--muted);font-weight:700;font-size:.85rem;margin-bottom:8px}
.moodl{display:flex;justify-content:space-between;font-weight:800;font-size:.88rem;margin-bottom:4px;gap:8px}
.needs{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.need-l{display:flex;justify-content:space-between;font-size:.82rem;font-weight:800;margin-bottom:3px;gap:6px}
.need-l span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:640px){.colstrip{grid-template-columns:auto minmax(0,1fr);gap:14px}.colstrip .needs{display:none}.portrait{width:70px;height:70px;font-size:2.5rem}}

/* ==================== HOY: AHORA ==================== */
.hoy-grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);grid-template-areas:"now top" "plan top" "plan bot";gap:16px;align-items:start}
#hoy-now{grid-area:now;min-width:0} #hoy-sidetop{grid-area:top;min-width:0} #hoy-plan{grid-area:plan;min-width:0} #hoy-sidebot{grid-area:bot;min-width:0}
#hoy-sidetop,#hoy-sidebot,#hoy-plan{display:flex;flex-direction:column;gap:14px}
#hoy-sidetop:empty{display:none}
@media (max-width:900px){.hoy-grid{grid-template-columns:minmax(0,1fr);grid-template-areas:"now" "top" "plan" "bot"}}
.now{border-left:8px solid var(--bc,var(--gold));display:flex;flex-direction:column;gap:10px}
.now-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:800;color:var(--soft)}
.now-badge{background:var(--gold);color:#3a2503;font-weight:900;font-size:.72rem;letter-spacing:1px;border-radius:6px;padding:.2em .55em}
.now-clock{font-family:var(--hero-font);font-size:1.15rem;font-weight:900;color:#fff;font-variant-numeric:tabular-nums}
.job{background:rgba(0,0,0,.3);border:2px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:7px}
.job-l{font-size:.75rem;font-weight:900;letter-spacing:1.5px;color:var(--label);text-transform:uppercase}
.job-n{font-size:1.35rem;font-weight:900;line-height:1.2;overflow-wrap:anywhere}
.job-meta{display:flex;gap:8px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);font-weight:700}
.job-step{font-size:.93rem;color:var(--soft);line-height:1.45}
.job-step b{color:var(--label)}
.job-btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}

/* ==================== HOY: CARTAS Y ALERTAS ==================== */
.letters{display:flex;flex-direction:column;gap:8px}
.ltr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 12px;border-radius:14px;border:2px solid var(--lc);background:color-mix(in srgb,var(--lc) 13%,rgba(17,13,30,.92));color:#fff;cursor:pointer;font-size:.95rem}
.ltr:hover{filter:brightness(1.12)}
.ltr .env{font-size:1.6rem}
.ltr.nuevo .env{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18) rotate(-6deg)}}
.ltr b{display:block;overflow-wrap:anywhere}
.ltr small{color:var(--muted);font-weight:700;font-size:.8rem}
.ltr .lk{font-size:.68rem;font-weight:900;text-transform:uppercase;letter-spacing:.5px;color:var(--lc)}
.alerts{display:flex;flex-direction:column;gap:6px}
.alert{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;border:none;border-left:5px solid var(--ac,var(--warn));background:rgba(17,13,30,.94);color:#fff;padding:9px 12px;border-radius:10px;cursor:pointer;font-size:.9rem;font-weight:700}
.alert:hover{background:rgba(40,30,66,.96)}
.alert small{color:var(--muted);font-weight:800;white-space:nowrap}
.buff{display:flex;gap:8px;align-items:center;background:rgba(246,176,44,.14);border:2px solid var(--gold);border-radius:12px;padding:8px 12px;font-weight:800;font-size:.9rem}
.side-h{font-size:.78rem;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;color:var(--label);margin:0 0 6px}

/* ==================== HOY: PLAN DEL DIA ==================== */
.sec{border-left:6px solid var(--bc);padding:12px 14px}
.sec.now-sec{box-shadow:0 0 0 3px var(--gold),0 14px 30px rgba(0,0,0,.4)}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.sec-ico{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;background:color-mix(in srgb,var(--bc) 35%,transparent);border:2px solid var(--bc);flex-shrink:0}
.sec-t{flex:1;min-width:0}
.sec-t b{display:block;font-size:1.02rem}
.sec-t small{color:var(--muted);font-weight:700;font-size:.8rem}
.sec-p{font-size:.85rem;font-weight:900;color:var(--soft);white-space:nowrap;font-variant-numeric:tabular-nums}
.ahora{background:var(--gold);color:#3a2503;font-size:.66rem;font-weight:900;padding:.15em .5em;border-radius:6px;margin-left:6px;vertical-align:2px;letter-spacing:.5px}
.trows{display:flex;flex-direction:column}
.secd summary{cursor:pointer;color:var(--muted);font-weight:800;font-size:.85rem;padding:4px 0}
.secd summary:hover{color:#fff}
.trow{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 2px;border-top:1px solid rgba(255,255,255,.06)}
.trow:first-child{border-top:none}
.chk{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.45);background:transparent;color:#0b2e1f;font-weight:900;font-size:1.05rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .1s;padding:0}
.chk:hover{transform:scale(1.08);border-color:var(--good)}
.chk.on{background:var(--good);border-color:var(--good)}
.tmain{min-width:0;cursor:pointer;background:none;border:none;color:inherit;text-align:left;padding:2px 0;font-size:1rem}
.tmain b{display:block;font-size:.97rem;overflow-wrap:anywhere}
.tmain small{display:block;color:var(--muted);font-size:.78rem;font-weight:700}
.trow.done .tmain b{text-decoration:line-through;opacity:.6}
.badge{display:inline-block;font-size:.68rem;font-weight:900;border-radius:99px;padding:.12em .55em;margin-left:6px;vertical-align:1px;white-space:nowrap}
.badge.late{background:rgba(255,107,90,.22);color:#ffb3a8}
.badge.ess{background:rgba(61,220,151,.18);color:#9ff0c8}
.play{width:36px;height:34px;border-radius:10px;border:none;background:var(--dark);box-shadow:0 3px 0 var(--dark-d);color:#fff;cursor:pointer;font-size:.85rem}
.play:hover{background:var(--purple)}
.dayfoot{display:flex;flex-direction:column;gap:8px}
.dayfoot .bar{height:14px}
.tipcard{cursor:pointer;background:linear-gradient(165deg,#fffdf4,#f3e6c4);color:#2b1d45;border:3px solid var(--dark-d);border-radius:18px;padding:14px 16px;box-shadow:0 12px 24px rgba(0,0,0,.5),inset 0 0 0 3px #fffef9;display:flex;flex-direction:column;gap:6px;text-align:center;animation:floaty 3.4s ease-in-out infinite alternate}
.tipcard .h{font-family:'Arial Black',sans-serif;font-weight:900;color:#a8261f;letter-spacing:2px;font-size:.8rem}
.tipcard .e{font-size:2.3rem}
.tipcard .t{font-weight:700;font-size:.95rem;line-height:1.45}
.tipcard .f{font-size:.72rem;color:#5d4d7d;font-weight:700}
@keyframes floaty{from{transform:rotate(-1.5deg) translateY(0)}to{transform:rotate(1deg) translateY(-5px)}}

/* ==================== CASA: PLANO ==================== */
.plan{position:relative;width:100%;aspect-ratio:15/10;border-radius:14px;overflow:hidden;border:3px solid #2b3d4f;
  background-color:#101b26;background-image:linear-gradient(rgba(120,170,220,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(120,170,220,.08) 1px,transparent 1px);background-size:calc(100% / 15) calc(100% / 10);-webkit-user-select:none;user-select:none}
.plan.editing{outline:3px dashed var(--gold);outline-offset:3px;touch-action:none}
.room{position:absolute;border:4px solid #1c1510;border-radius:3px;overflow:hidden;cursor:pointer;color:#fff;padding:5px 7px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.07)}
.room:hover{filter:brightness(1.12)}
.plan.editing .room{cursor:grab}
.room.sel{outline:4px solid var(--gold);outline-offset:-4px;z-index:3}
.pat-tiles{background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);background-size:14px 14px}
.pat-wood{background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.14) 0 2px,transparent 2px 22px)}
.pat-checker{background-image:conic-gradient(rgba(255,255,255,.07) 25%,transparent 0 50%,rgba(255,255,255,.07) 0 75%,transparent 0);background-size:20px 20px}
.pat-carpet{background-image:radial-gradient(rgba(255,255,255,.08) 1px,transparent 1.5px);background-size:8px 8px}
.pat-grass{background-image:repeating-linear-gradient(45deg,rgba(0,0,0,.12) 0 3px,transparent 3px 9px)}
.room .rn{position:relative;z-index:2;font-weight:900;font-size:clamp(.6rem,1.5vw,.92rem);text-shadow:0 1px 2px #000,0 0 5px #000;line-height:1.15;overflow:hidden;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
@media (max-width:560px){.room{padding:3px 4px}.room .rn{font-size:.68rem}.room .rc{font-size:.66rem}}
.room .rc{position:relative;z-index:2;display:inline-block;margin-top:3px;font-size:clamp(.55rem,1.3vw,.78rem);font-weight:900;border-radius:6px;padding:.05em .45em;background:rgba(0,0,0,.6)}
.room .prop{position:absolute;z-index:1;font-size:clamp(.9rem,2.6vw,1.6rem);opacity:.85;pointer-events:none}
.filth{position:absolute;z-index:1;border-radius:50%;background:rgba(92,62,26,.85);pointer-events:none}
.room .fly{position:absolute;z-index:2;font-size:clamp(.7rem,1.8vw,1.1rem);animation:fly 2.5s ease-in-out infinite;pointer-events:none}
@keyframes fly{0%,100%{transform:translate(0,0)}25%{transform:translate(6px,-5px)}50%{transform:translate(-4px,3px)}75%{transform:translate(5px,4px)}}
.room .handle{position:absolute;right:0;bottom:0;width:28px;height:28px;z-index:4;background:var(--gold);clip-path:polygon(100% 0,100% 100%,0 100%);cursor:nwse-resize;touch-action:none}
.plan-sum{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;font-weight:800}
.room-ed{display:flex;flex-direction:column;gap:10px}
.ed-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ed-row>span{font-weight:800;color:var(--label);font-size:.85rem;min-width:62px}
.rlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.rcard{display:flex;flex-direction:column;gap:6px;text-align:left;border:2px solid var(--line);background:var(--panel);border-radius:16px;padding:12px 14px;color:#fff;cursor:pointer;font-size:1rem}
.rcard:hover{border-color:rgba(255,255,255,.35)}
.rcard-h{display:flex;align-items:center;gap:10px}
.rcard-h .e{font-size:1.6rem}
.rcard-h b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rcard small{color:var(--muted);font-weight:700;font-size:.8rem}
.tlist{display:flex;flex-direction:column;gap:6px}
.titem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--panel-2)}
.titem.off{opacity:.5}
.titem .tn{cursor:pointer;background:none;border:none;color:inherit;text-align:left;padding:0;min-width:0;font-size:1rem}
.titem .tn b{display:block;font-size:.95rem;overflow-wrap:anywhere}
.titem .tn small{display:block;color:var(--muted);font-size:.78rem;font-weight:700}
.titem .bar{height:8px;margin-top:5px}
.tbtns{display:flex;gap:6px;align-items:center}

/* ==================== COCINA ==================== */
.weeknav{display:flex;align-items:center;justify-content:center;gap:12px;font-weight:900;text-align:center}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
@media (max-width:1000px){.week{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
.dayc{background:var(--panel-2);border:2px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.dayc.today{border-color:var(--gold)}
.dayc-h{font-weight:900;font-size:.85rem;display:flex;justify-content:space-between;gap:6px;color:var(--label)}
.dayc-h small{color:var(--muted)}
.slotb{display:flex;flex-direction:column;gap:2px;border:2px dashed rgba(255,255,255,.22);background:transparent;border-radius:10px;padding:6px;color:#fff;cursor:pointer;text-align:left;min-height:60px;font-size:.82rem}
.slotb:hover{border-color:var(--gold)}
.slotb.full{border-style:solid;border-color:rgba(255,255,255,.18);background:rgba(255,255,255,.05)}
.slotb small{font-size:.64rem;font-weight:900;letter-spacing:1px;color:var(--muted);text-transform:uppercase}
.slotb span{font-weight:800;overflow-wrap:anywhere;line-height:1.25}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.rcp{display:flex;flex-direction:column;gap:6px;text-align:left;border:2px solid var(--line);background:var(--panel);border-radius:16px;padding:14px;color:#fff;cursor:pointer;transition:transform .12s;font-size:1rem}
.rcp:hover{transform:translateY(-3px) rotate(-.6deg);border-color:rgba(255,255,255,.35)}
.rcp .e{font-size:2.3rem}
.rcp b{font-size:1.02rem;line-height:1.25}
.ing{display:flex;flex-direction:column;gap:4px;margin:0;padding:0;list-style:none}
.ing li{display:flex;justify-content:space-between;gap:10px;background:var(--panel-2);border-radius:8px;padding:.4em .7em;font-weight:700;font-size:.92rem}
.ing li span:last-child{color:var(--muted);white-space:nowrap}
.steps{margin:0;padding:0;list-style:none;counter-reset:st;display:flex;flex-direction:column;gap:4px}
.steps li{counter-increment:st;display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;cursor:pointer;padding:6px;border-radius:10px;line-height:1.45;font-size:.95rem}
.steps li:hover{background:var(--panel-2)}
.steps li::before{content:counter(st);width:28px;height:28px;border-radius:50%;background:var(--gold);color:#3a2503;font-weight:900;display:flex;align-items:center;justify-content:center}
.steps li.done{opacity:.5;text-decoration:line-through}
.shop-sec{margin-top:12px}
.shop-sec h4{margin:0 0 4px;font-size:.82rem;color:var(--label);text-transform:uppercase;letter-spacing:1px}
.sitem{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:5px 2px;border-top:1px solid rgba(255,255,255,.06)}
.sitem.done .sn{text-decoration:line-through;opacity:.55}
.sitem .sn{font-weight:700;overflow-wrap:anywhere}
.sitem .sn small{color:var(--muted);font-weight:700;margin-left:6px}
.xbtn{width:30px;height:30px;border-radius:8px;border:none;background:var(--dark);color:#fff;cursor:pointer;font-weight:900}
.add-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px}
@media (max-width:560px){.add-row{grid-template-columns:1fr 1fr}.add-row .txt:first-child{grid-column:1/-1}}

/* ==================== CUERPO ==================== */
.mode-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.mode-card{position:relative;border:none;cursor:pointer;color:#fff;text-align:left;padding:16px 18px;border-radius:18px;display:flex;flex-direction:column;gap:6px;
  box-shadow:0 6px 0 rgba(0,0,0,.35),0 14px 24px rgba(0,0,0,.45);transition:transform .1s;overflow:hidden;min-height:128px;font-size:1rem}
.mode-card:hover{transform:translateY(-3px) rotate(-.7deg) scale(1.015)}
.mode-card:active{transform:translateY(2px)}
.mc-ico{position:absolute;right:8px;top:-4px;font-size:3.8rem;opacity:.3;transform:rotate(12deg);pointer-events:none}
.mc-t{font-size:1.15rem;font-weight:900;text-shadow:0 2px 0 rgba(0,0,0,.4);padding-right:40px}
.mc-d{font-size:.87rem;font-weight:600;opacity:.95;line-height:1.35;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.mc-red{background:linear-gradient(160deg,#c93a22,#8e1f30)}
.mc-teal{background:linear-gradient(160deg,#13806c,#0b4f43)}
.mc-blue{background:linear-gradient(160deg,#4468d4,#2e44a8)}
.mc-purple{background:linear-gradient(160deg,#8a52c8,#5a2499)}
.mc-gold{background:linear-gradient(160deg,#f6b02c,#d0741a);color:#2e1c06}
.mc-gold .mc-t,.mc-gold .mc-d{text-shadow:0 1px 0 rgba(255,255,255,.25)}
.big-num{font-family:var(--hero-font);font-size:clamp(2rem,7vw,2.8rem);font-weight:900;-webkit-text-stroke:1px var(--ink);text-shadow:0 4px 0 rgba(0,0,0,.4);line-height:1.1}
.mchart{display:grid;gap:6px;height:120px;align-items:end;border-bottom:1px solid rgba(255,255,255,.28);padding-top:18px}
.mcol{position:relative;height:100%;display:flex;align-items:flex-end;justify-content:center;border-radius:6px 6px 0 0}
.mcol:hover,.mcol:focus-visible{background:var(--panel-2)}
.mcol i{display:block;width:min(28px,80%);border-radius:4px 4px 0 0;min-height:0}
.mcol .v{position:absolute;left:50%;transform:translateX(-50%);font-size:.72rem;font-weight:900;color:var(--soft);white-space:nowrap}
.mx{display:grid;gap:6px;font-size:.72rem;color:var(--muted);text-align:center;font-weight:800;margin-top:4px}
.mx .cur{color:var(--gold)}

/* ==================== SEMANA ==================== */
.sched-wrap{overflow-x:auto}
.sched{display:grid;grid-template-columns:44px repeat(7,minmax(34px,1fr));gap:2px;min-width:300px;-webkit-user-select:none;user-select:none}
.sched.editing{touch-action:none;cursor:crosshair}
.sch{font-size:.75rem;font-weight:900;text-align:center;color:var(--label);padding:3px 0}
.sch.today{color:#3a2503;background:var(--gold);border-radius:6px}
.shl{font-size:.68rem;color:var(--muted);text-align:right;padding-right:5px;font-variant-numeric:tabular-nums;line-height:20px}
.sc{height:20px;border-radius:3px;font-size:.72rem;display:flex;align-items:center;justify-content:center;overflow:hidden}
.sc.nowc{box-shadow:inset 0 0 0 2px #fff}
.legend{display:flex;gap:8px 16px;flex-wrap:wrap;font-size:.82rem;font-weight:700;color:var(--soft)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.brushes{display:flex;gap:6px;flex-wrap:wrap}
.brush{display:flex;align-items:center;gap:6px;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff;border-radius:99px;padding:.35em .8em;font-weight:800;cursor:pointer;font-size:.85rem}
.brush i{width:14px;height:14px;border-radius:4px;display:inline-block}
.brush.sel{border-color:var(--gold);background:rgba(246,176,44,.2)}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.theme{background:var(--panel-2);border:2px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.theme.today{border-color:var(--gold)}
.theme-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.theme-h b{font-size:1.02rem}
.theme-h small{color:var(--muted);font-weight:700;font-size:.8rem;text-align:right}
.mini-t{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;align-items:center;font-size:.86rem}
.mini-t .tn{background:none;border:none;color:#fff;text-align:left;cursor:pointer;padding:2px 0;font-weight:700;font-size:.86rem;min-width:0;overflow-wrap:anywhere}
.mini-t small{color:var(--muted);font-weight:700;white-space:nowrap}
.mini-sel{font-size:.78rem;padding:.25em .3em;border-radius:8px;background:var(--input);color:#fff;border:2px solid var(--purple-d);max-width:92px}
.warnline{color:#ffd29a;font-weight:800;font-size:.82rem}

/* ==================== FORMULARIOS ==================== */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span,.field-l{font-weight:800;color:var(--label);font-size:.92rem}
.field small{color:var(--muted);font-size:.8rem;line-height:1.35}
.txt{font-size:1.02rem;font-weight:700;color:#fff;background:var(--input);border:2px solid var(--purple-d);border-radius:12px;padding:.55em .8em;width:100%;outline:none}
.txt:focus{border-color:var(--gold)}
.txt::placeholder{color:#8f80b5;font-weight:600}
input[type=date].txt,input[type=month].txt{color-scheme:dark}
select.txt{cursor:pointer}
select option{background:#1d1140;color:#fff}
.inwrap{display:flex;align-items:center;background:var(--input);border:2px solid var(--purple-d);border-radius:12px;overflow:hidden}
.inwrap:focus-within{border-color:var(--gold)}
.inwrap i{font-style:normal;font-weight:900;color:var(--muted);padding:0 .8em 0 .2em;white-space:nowrap}
.inwrap .txt{border:none;background:transparent;min-width:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.row2{grid-template-columns:1fr}}
.check{display:flex;gap:8px;align-items:center;font-weight:700;color:var(--soft);font-size:.9rem;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--gold);flex-shrink:0}
.emoji-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.emo{font-size:1.45rem;padding:.25em 0;border-radius:10px;border:2px solid transparent;background:rgba(255,255,255,.06);cursor:pointer}
.emo.sel{border-color:var(--gold);background:rgba(246,176,44,.2)}
.daychips .chip{min-width:52px;text-align:center}

/* ==================== MODAL ==================== */
#modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:14px;background:rgba(8,4,18,.7);backdrop-filter:blur(3px)}
#modal.show{display:flex}
.modal-box{position:relative;width:min(540px,100%);max-height:calc(100vh - 28px);max-height:calc(100dvh - 28px);overflow-y:auto;animation:popIn .22s cubic-bezier(.2,.9,.3,1.3) both;outline:none}
.modal-box.wide{width:min(800px,100%)}
.modal-inner,.mc{display:flex;flex-direction:column;gap:14px}
@keyframes popIn{from{transform:scale(.82) rotate(-1.5deg);opacity:0}to{transform:none;opacity:1}}
.modal-x{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:10px;border:none;background:var(--dark);color:#fff;font-weight:900;cursor:pointer;box-shadow:0 3px 0 var(--dark-d);z-index:2}
.mc h3{margin:0;padding-right:44px;font-size:1.3rem;color:var(--label)}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;align-items:center;
  position:sticky;bottom:-16px;margin:0 -18px -16px;padding:12px 18px 16px;background:#140b2a;border-top:2px solid var(--line);border-radius:0 0 16px 16px;z-index:1}
.modal-actions .btn.big{flex:1}
body.modal-open{overflow:hidden}
.info-box{background:rgba(0,0,0,.28);border:2px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;line-height:1.45}
.info-box b{color:var(--label)}

/* ==================== TRABAJO Y EJERCICIO ==================== */
#workbar{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:16;width:min(520px,calc(100% - 24px));border:2px solid var(--gold);border-radius:16px;background:#1a1330;box-shadow:0 10px 26px rgba(0,0,0,.55);padding:10px 12px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;cursor:pointer;color:#fff;text-align:left;font-size:1rem}
#workbar .wb-e{font-size:1.5rem;display:inline-block;animation:wiggle 1.4s ease-in-out infinite}
#workbar b{display:block;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#workbar small{color:var(--muted);font-weight:800;font-size:.78rem;font-variant-numeric:tabular-nums;white-space:nowrap}
#workbar .bar{height:8px;margin-top:4px}
@media (max-width:760px){#workbar{bottom:calc(84px + env(safe-area-inset-bottom))}}
.jobbar{height:24px;border-radius:8px;background:#0d0a1a;border:2px solid #4a3d70;overflow:hidden;position:relative}
.jobbar>i{display:block;height:100%;background:linear-gradient(90deg,#c9a227,#f6d36b);transition:width 1s linear}
.jobbar span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:.8rem;font-weight:900;white-space:nowrap;background:rgba(13,10,26,.85);padding:0 .6em;border-radius:6px}
.big-time{font-family:var(--hero-font);font-size:clamp(2.4rem,9vw,3.4rem);font-weight:900;text-align:center;font-variant-numeric:tabular-nums;-webkit-text-stroke:1px var(--ink);text-shadow:0 4px 0 rgba(0,0,0,.4)}
.wo{display:flex;flex-direction:column;gap:12px;text-align:center;align-items:center}
.wo-phase{font-size:.78rem;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:var(--label)}
.wo-name{font-family:'Arial Black','Segoe UI',sans-serif;font-size:clamp(1.5rem,6vw,2.2rem);font-weight:900;-webkit-text-stroke:1px var(--ink);text-shadow:0 4px 0 var(--ink);line-height:1.15}
.wo.rest .wo-name{color:#9fd8ff}
.wo-cue{color:var(--soft);line-height:1.5;max-width:460px;margin:0}
.wo-reps{font-size:1.5rem;font-weight:900;color:var(--gold)}
.wo-dots{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:460px}
.wo-dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.2)}
.wo-dots i.done{background:var(--good)} .wo-dots i.cur{background:var(--gold);transform:scale(1.4)}

/* ==================== INSPECTOR DEL COLONO ==================== */
.insp-head{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.insp-sec h4{margin:4px 0 8px;font-size:.82rem;text-transform:uppercase;letter-spacing:1px;color:var(--label)}
.thoughts{display:flex;flex-direction:column;gap:4px}
.th{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:8px;align-items:center;background:var(--panel-2);border-radius:8px;padding:.4em .7em;font-weight:700;font-size:.9rem}
.th .v{font-weight:900;font-variant-numeric:tabular-nums}
.th .v.pos{color:var(--good)} .th .v.neg{color:var(--bad)} .th .v.zero{color:var(--muted)}
.skills{display:flex;flex-direction:column;gap:10px}
.skill{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:center}
.skill .lv{font-family:var(--hero-font);font-size:1.35rem;font-weight:900;text-align:center;background:rgba(255,255,255,.08);border-radius:10px;padding:4px 0}
.skill .sk-top{display:flex;justify-content:space-between;gap:8px;font-size:.9rem;font-weight:800;margin-bottom:3px}
.skill .sk-top small{color:var(--muted);font-weight:700;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.stat{background:var(--panel-2);border-radius:12px;padding:8px 12px}
.stat span{display:block;font-size:.7rem;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.stat b{font-size:1.25rem}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.ach{display:flex;gap:8px;align-items:center;background:var(--panel-2);border-radius:12px;padding:8px 10px;font-size:.82rem}
.ach .e{font-size:1.5rem}
.ach.lock{opacity:.45;filter:grayscale(1)}
.ach b{display:block;font-size:.85rem}
.ach small{color:var(--muted);font-weight:700}
.loglist{display:flex;flex-direction:column;gap:3px;font-size:.86rem}
.loglist div{display:flex;justify-content:space-between;gap:10px;padding:.3em .6em;border-radius:8px;background:var(--panel-2)}
.loglist small{color:var(--muted);font-weight:700;white-space:nowrap}

/* ==================== ONBOARDING Y MANUAL ==================== */
.ob{display:flex;flex-direction:column;gap:14px;min-height:340px}
.ob h3{text-align:center;padding:0 !important}
.ob-e{font-size:3.2rem;text-align:center;animation:wiggle 3s ease-in-out infinite}
.ob p{margin:0;line-height:1.55;color:var(--soft)}
.ob p b{color:var(--label)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.opt{display:flex;flex-direction:column;gap:6px;text-align:left;border:3px solid rgba(255,255,255,.14);background:var(--panel-2);border-radius:16px;padding:12px;color:#fff;cursor:pointer;font-size:.95rem}
.opt:hover{border-color:rgba(255,255,255,.35)}
.opt.sel{border-color:var(--gold);background:rgba(246,176,44,.13)}
.opt b{font-size:1rem}
.opt small{color:var(--muted);line-height:1.35;font-weight:600}
.opt .e{font-size:1.8rem}
.mini-plan{position:relative;aspect-ratio:15/10;border-radius:8px;background:#101b26;overflow:hidden;border:2px solid #2b3d4f}
.mini-plan i{position:absolute;border:2px solid #1c1510;display:flex;align-items:center;justify-content:center;font-size:.9rem;font-style:normal}
.mini-day{display:grid;grid-template-columns:repeat(24,1fr);height:12px;border-radius:4px;overflow:hidden}
.g-steps{display:flex;flex-direction:column;gap:8px}
.g-step{display:flex;gap:12px;align-items:center;background:var(--panel-2);border-radius:12px;padding:10px 12px;font-weight:700;line-height:1.35}
.g-step .n{width:34px;height:34px;border-radius:50%;background:var(--gold);color:#3a2503;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:1.05rem}
.ob-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:auto -18px -16px;padding:12px 18px 16px;position:sticky;bottom:-16px;background:#140b2a;border-top:2px solid var(--line);border-radius:0 0 16px 16px;z-index:1}
.dots{display:flex;gap:7px}
.dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.22)}
.dot.on{background:var(--gold);transform:scale(1.3)}
@media (max-width:480px){.ob-nav{gap:6px}.ob-nav .btn{padding:.6em .85em}.dots{gap:4px}.dot{width:7px;height:7px}}
.guides{display:flex;flex-direction:column;gap:8px}
.guide{border:2px solid var(--line);border-radius:14px;background:var(--panel-2);overflow:hidden}
.guide>button{width:100%;display:flex;gap:10px;align-items:center;padding:12px 14px;border:none;background:transparent;color:#fff;cursor:pointer;text-align:left;font-size:1rem;font-weight:900}
.guide>button .e{font-size:1.45rem}
.guide>button .ar{margin-left:auto;transition:transform .2s;color:var(--muted)}
.guide.open>button .ar{transform:rotate(180deg)}
.guide-body{padding:0 16px 14px;display:none}
.guide.open .guide-body{display:block}
.guide-body ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px;line-height:1.5;color:var(--soft)}
.guide-body p{margin:0 0 8px;color:var(--soft);line-height:1.5}
.warnbox{background:rgba(255,107,90,.14);border:2px solid #ff6b5a;border-radius:10px;padding:8px 12px;margin-top:10px;font-weight:800;color:#ffd0c9}
.kit-cat{margin-bottom:12px}
.kit-cat h4{margin:0 0 4px;font-size:.85rem;color:var(--label);text-transform:uppercase;letter-spacing:1px}
.kit-item{display:flex;gap:10px;align-items:center;padding:6px 4px;cursor:pointer;font-weight:700;font-size:.92rem;border-radius:8px}
.kit-item:hover{background:var(--panel-2)}
.kit-item input{width:20px;height:20px;accent-color:var(--gold);flex-shrink:0}
.kit-item.on span{opacity:.6}

/* ==================== AVISOS Y EFECTOS ==================== */
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(30px);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
  background:rgba(20,11,42,.97);border:2px solid rgba(255,255,255,.25);border-radius:14px;padding:.6em .8em .6em 1.1em;font-weight:800;display:flex;gap:12px;align-items:center;
  box-shadow:0 10px 24px rgba(0,0,0,.55);max-width:calc(100vw - 24px)}
#toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
#toast:not(.show){visibility:hidden}
body.has-work #toast{bottom:96px}
@media (max-width:760px){#toast{bottom:calc(100px + env(safe-area-inset-bottom))}body.has-work #toast{bottom:calc(160px + env(safe-area-inset-bottom))}}
#achbar{position:fixed;left:50%;top:14px;transform:translateX(-50%) translateY(-140%);z-index:65;transition:transform .35s cubic-bezier(.2,.9,.3,1.2);background:linear-gradient(160deg,#2a1f4a,#17112b);border:3px solid var(--gold);border-radius:16px;padding:10px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 12px 26px rgba(0,0,0,.6);pointer-events:none;max-width:calc(100vw - 24px)}
#achbar.show{transform:translateX(-50%) translateY(0)}
#achbar .e{font-size:2rem}
#achbar small{display:block;color:var(--label);font-weight:900;font-size:.7rem;letter-spacing:1.5px;text-transform:uppercase}
#achbar b{font-size:1rem}
#fx{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.float{position:absolute;left:50%;top:30%;font-family:var(--hero-font);font-weight:900;font-size:2rem;-webkit-text-stroke:1.5px var(--ink);text-shadow:0 4px 0 var(--ink);animation:floatUp 1.2s ease-out forwards;white-space:nowrap}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-170%) scale(1)}}
.confetti{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--rot))}}
#tip{position:fixed;z-index:80;pointer-events:none;opacity:0;background:#0e0820;border:1.5px solid rgba(255,255,255,.3);border-radius:10px;padding:.45em .7em;font-size:.85rem;font-weight:700;max-width:260px;white-space:pre-line;line-height:1.45;transition:opacity .12s;box-shadow:0 8px 18px rgba(0,0,0,.5)}
#tip.show{opacity:1}

@media (prefers-reduced-motion: reduce){
  *{animation:none !important;transition:none !important}
}

<script>
'use strict';
/* ==================== UTILIDADES ==================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const ESC_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ESC_MAP[c]);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad2 = n => String(n).padStart(2, '0');
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const has = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
const rand = n => Math.floor(Math.random() * n);
const pick = a => a[rand(a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

const DAYS = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];
const DAYS_S = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
const MONTHS = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];

const dateStr = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const todayStr = () => dateStr(new Date());
const parseDate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseDate(s); d.setDate(d.getDate() + n); return dateStr(d); };
const diffDays = (a, b) => Math.round((parseDate(b) - parseDate(a)) / 864e5);
/* 0 = lunes ... 6 = domingo */
const wdOf = s => (parseDate(s).getDay() + 6) % 7;
const isDate = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(parseDate(s));
const nowHour = () => new Date().getHours();
const hhmm = h => pad2(h % 24) + ':00';
const weekStart = s => addDays(s, -wdOf(s));
function dateLabel(s) { const d = parseDate(s); return `${DAYS[wdOf(s)].toLowerCase()} ${d.getDate()} de ${MONTHS[d.getMonth()]}`; }
function shortDate(s) { const d = parseDate(s); return `${d.getDate()} ${MONTHS[d.getMonth()].slice(0, 3)}`; }
function durLabel(min) {
  min = Math.round(min);
  if (min < 60) return min + ' min';
  const h = Math.floor(min / 60), m = min % 60;
  return h + ' h' + (m ? ' ' + m + ' min' : '');
}
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) {
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}

/* ==================== HORARIO ==================== */
/* Colores validados para el orden en que se tocan en el dia; dormir y libre van apagados a proposito */
const BT = {
  dormir:    { n: 'Dormir', e: '😴', c: '#26306b' },
  rutina:    { n: 'Rutina personal', e: '🪥', c: '#199e70' },
  trabajo:   { n: 'Trabajo o estudio', e: '💼', c: '#3987e5' },
  comida:    { n: 'Comida', e: '🍽️', c: '#c98500' },
  tareas:    { n: 'Tareas de la casa', e: '🧹', c: '#d55181' },
  ejercicio: { n: 'Ejercicio', e: '💪', c: '#9085e9' },
  libre:     { n: 'Libre', e: '🎮', c: '#4f4a63' },
};
const BT_IDS = Object.keys(BT);

function dayRow(spec) {
  const row = Array(24).fill('libre');
  for (const [t, a, b] of spec) for (let h = a; h < b; h++) row[h] = t;
  return row;
}
const SAT = () => dayRow([['dormir', 0, 8], ['rutina', 8, 9], ['ejercicio', 9, 10], ['tareas', 10, 12], ['comida', 13, 14], ['comida', 20, 21], ['rutina', 22, 23], ['dormir', 23, 24]]);
const SUN = () => dayRow([['dormir', 0, 8], ['rutina', 8, 9], ['tareas', 10, 12], ['comida', 13, 14], ['comida', 20, 21], ['rutina', 22, 23], ['dormir', 23, 24]]);
const SCHED_TPL = {
  oficina: { n: 'Trabajo o estudio de 9 a 17', e: '🏢', d: 'Lunes a viernes de 9 a 17. Ejercicio a las 18 y tareas de la casa a las 19.',
    make: () => { const w = () => dayRow([['dormir', 0, 7], ['rutina', 7, 8], ['trabajo', 9, 13], ['comida', 13, 14], ['trabajo', 14, 17], ['ejercicio', 18, 19], ['tareas', 19, 20], ['comida', 20, 21], ['rutina', 22, 23], ['dormir', 23, 24]]); return [w(), w(), w(), w(), w(), SAT(), SUN()]; } },
  manana: { n: 'Estudio o trabajo en la mañana', e: '🎒', d: 'De 7 a 13. Las tardes quedan para tareas y ejercicio.',
    make: () => { const w = () => dayRow([['dormir', 0, 6], ['rutina', 6, 7], ['trabajo', 7, 13], ['comida', 13, 14], ['tareas', 15, 16], ['ejercicio', 17, 18], ['comida', 20, 21], ['rutina', 22, 23], ['dormir', 23, 24]]); return [w(), w(), w(), w(), w(), SAT(), SUN()]; } },
  tarde: { n: 'Trabajo o estudio en la tarde', e: '🌆', d: 'De 14 a 22. Las mañanas quedan para tareas y ejercicio.',

/* ==================== HABILIDADES Y AREAS ==================== */
const SKILLS = {
  limpieza: { n: 'Limpieza', e: '🧽' },

  orden: { n: 'Organización', e: '📋' },

const SKILL_IDS = Object.keys(SKILLS);
const AREAS = {
  casa: { n: 'Casa', e: '🧹' },
  cocina: { n: 'Comida', e: '🍳' },
  aseo: { n: 'Aseo', e: '🧴' },
  ejercicio: { n: 'Ejercicio', e: '💪' },

const AREA_IDS = Object.keys(AREAS);
const SLOTS = {
  manana: { n: 'Rutina de la mañana', e: '🌅' },
  almuerzo: { n: 'Almuerzo', e: '🍽️' },
  tareas: { n: 'Tareas de la casa', e: '🧹' },
  ejercicio: { n: 'Ejercicio', e: '💪' },

const SLOT_IDS = Object.keys(SLOTS);
const NEEDS = [
  { id: 'hogar', n: 'Hogar', e: '🏠', c: 'var(--n-hogar)' },
  { id: 'comida', n: 'Comida', e: '🍳', c: 'var(--n-comida)' },

/* ==================== TAREAS POR DEFECTO ==================== */
/* sched: 'd' todos los dias, 'w:0,2,4' dias fijos (0 = lunes), 'c:N' cada N dias, 'c:N:wd' cada N dias cerca de ese dia */
const T = (key, name, min, slot, sched, skill, o = {}) => ({ key, name, min, slot, sched, skill, ...o });

const ROOM_TYPES = {
  cocina: { n: 'Cocina', e: '🍳', floor: '#5c4426', pat: 'checker', props: ['🍳', '🧊', '🫖'], tasks: [
    T('platos', 'Lavar los platos', 15, 'cena', 'd', 'limpieza', { ess: 1, step: 'Llena el lavaplatos con agua tibia y un chorrito de jabón.', tip: 'Lava en este orden: vasos, cubiertos, platos y al final las ollas. Lo más grasoso siempre al final.' }),
    T('mesones', 'Limpiar mesones y hornillas (rápido)', 5, 'cena', 'd', 'limpieza', { step: 'Moja un paño con agua y jabón, y escúrrelo bien.', tip: 'Hazlo apenas termines de comer: la grasa fresca sale sola, la de mañana no.' }),

    T('refri_rev', 'Revisar la refri y botar lo vencido', 10, 'tareas', 'w:2', 'orden', { step: 'Saca lo que esté en la puerta de la refri y revisa las fechas.', tip: 'Pon adelante lo que vence primero. Si dudas de algo, bótalo.' }),
    T('piso_cocina', 'Barrer y trapear la cocina', 10, 'tareas', 'w:4', 'limpieza', { step: 'Mueve el tacho y las sillas para barrer debajo.', tip: 'Barre primero y trapea después, desde el fondo hacia la puerta.' }),

    T('refri_fondo', 'Limpiar la refri por dentro', 25, 'tareas', 'c:30:5', 'limpieza', { step: 'Saca una bandeja y lávala con agua tibia.', tip: 'Hazlo antes de las compras, cuando la refri está más vacía.' }),
    T('alacenas', 'Ordenar y limpiar las alacenas', 30, 'tareas', 'c:90:5', 'orden', { step: 'Saca todo de un solo estante.', tip: 'Un estante por vez: si te cansas, ya avanzaste.' }),
  ] },
  bano: { n: 'Baño', e: '🚿', floor: '#24525c', pat: 'tiles', props: ['🚽', '🛁', '🪥'], tasks: [
    T('inodoro', 'Limpiar el inodoro', 10, 'tareas', 'w:0', 'limpieza', { step: 'Ponte guantes y echa limpiador dentro del inodoro.', tip: 'Deja actuar el producto mientras limpias el lavamanos. El inodoro siempre va al final.' }),
    T('lavamanos', 'Limpiar lavamanos y espejo', 10, 'tareas', 'w:0', 'limpieza', { step: 'Rocía el lavamanos y deja actuar mientras limpias el espejo.', tip: 'Seca el espejo con un paño seco después del limpiavidrios y no quedan marcas.' }),
    T('ducha', 'Limpiar la ducha', 10, 'tareas', 'w:0', 'limpieza', { step: 'Rocía paredes y piso de la ducha, y espera 5 minutos.', tip: 'El producto hace la mitad del trabajo. Frota de arriba hacia abajo.' }),
    T('toallas', 'Cambiar las toallas', 2, 'tareas', 'w:0', 'limpieza', { step: 'Lleva las toallas usadas al cesto de ropa.', tip: 'Con dos juegos de toallas siempre hay uno limpio.' }),

  dormitorio: { n: 'Dormitorio', e: '🛏️', floor: '#3d3060', pat: 'carpet', props: ['🛏️', '👕', '🪟'], tasks: [

  const m = {};
  for (const r of RECIPES) for (const [n, , , s] of r.ing) m[n.toLowerCase()] = s;
  for (const [n, s] of STAPLES) m[n.toLowerCase()] = s;

})();
function guessSec(name) {
  const k = name.trim().toLowerCase();
  if (has(SEC_GUESS, k)) return SEC_GUESS[k];
  if (/jab[oó]n de (platos|ropa)|detergente|cloro|esponja|funda|limpia|desinfect|trapeador|escoba/.test(k)) return 'limpieza';
  if (/pasta de dientes|champ[uú]|desodorante|papel higi|cepillo|toalla higi|jab[oó]n/.test(k)) return 'aseo';
  if (/leche|queso|yogur|mantequilla/.test(k)) return 'lacteos';
  if (/pan\b|tortilla/.test(k)) return 'panaderia';
  if (/pollo|carne|pescado|huevo|cerdo|chuleta/.test(k)) return 'proteinas';
  if (/fruta|manzana|banano|naranja|lim[oó]n|tomate|cebolla|papa|zanahoria|lechuga|verdura/.test(k)) return 'verduras';
  return 'otros';
}
function fmtQ(q) {
  if (!q) return '';
  const w = Math.floor(q + 1e-9), f = q - w;
  if (f < 0.01) return String(w);
  const fr = Math.abs(f - 0.25) < 0.01 ? '1/4' : Math.abs(f - 0.5) < 0.01 ? '1/2' : Math.abs(f - 0.75) < 0.01 ? '3/4' : '';
  if (fr) return (w ? w + ' ' : '') + fr;
  return String(Math.round(q * 10) / 10);
}
const PLURAL_U = ['taza', 'lata', 'diente', 'rebanada', 'filete', 'atado', 'tallo'];
function qtyLabel(q, u) {
  if (!q) return 'al gusto';
  const unit = !u || u === 'u' ? '' : (q > 1 && PLURAL_U.includes(u) ? u + 's' : u);
  return fmtQ(q) + (unit ? ' ' + unit : '');
}

function cleanSched(sc) {
  if (sc && sc.t === 'dias' && Array.isArray(sc.d)) {
    const d = [...new Set(sc.d.map(Number).filter(x => Number.isInteger(x) && x >= 0 && x <= 6))].sort((a, b) => a - b);
    if (d.length) return { t: 'dias', d };
  }
  if (sc && sc.t === 'cada') {
    const wd = Number(sc.wd);
    return { t: 'cada', n: Math.round(num(sc.n, 2, 730, 7)), wd: Number.isInteger(wd) && wd >= 0 && wd <= 6 ? wd : -1 };
  }
  return { t: 'dias', d: [0, 1, 2, 3, 4, 5, 6] };
}

    for (const [k, v] of Object.entries(o.shopped)) {
      const [d, sl] = k.split('|');
      if (isDate(d) && d >= from && (sl === 'a' || sl === 'c') && typeof v === 'string' && /^r:/.test(v) && recipeById(v.slice(2))) st.shopped[k] = v;
    }
  }
  if (o.kit && typeof o.kit === 'object') for (const k of KIT_IDS) if (o.kit[k]) st.kit[k] = true;
  if (o.cooked && typeof o.cooked === 'object') for (const r of RECIPES) { const n = Math.round(num(o.cooked[r.id], 0, 9999, 0)); if (n) st.cooked[r.id] = n; }
  if (o.ach && typeof o.ach === 'object') for (const a of ACH) if (isDate(o.ach[a.id])) st.ach[a.id] = o.ach[a.id];
  st.hardDays = Array.isArray(o.hardDays) ? [...new Set(o.hardDays.filter(isDate))].slice(-1500) : [];
  st.hard = okDate(o.hard);
  const w = o.work;
  if (w && typeof w === 'object' && isFinite(Number(w.start))) st.work = { tid: str(w.tid, 40), n: str(w.n, 60) || 'Tarea', min: Math.round(num(w.min, 1, 480, 10)), start: Number(w.start), kind: oneOf(w.kind, ['task', 'reset'], 'task'), rang: !!w.rang };
  const fl = o.flags || {};
  st.flags.fullDays = Array.isArray(fl.fullDays) ? [...new Set(fl.fullDays.filter(isDate))].slice(-1500) : [];
  if (fl.days && typeof fl.days === 'object') {
    for (const [d, v] of Object.entries(fl.days)) if (isDate(d)) { const c = Math.round(num(v, 0, 9999, 0)); if (c) st.flags.days[d] = c; }
  } else for (const e of st.log) if (e.k === 't' || e.k === 'w') st.flags.days[e.d] = (st.flags.days[e.d] || 0) + 1;
  const tot = fl.tot || {};
  st.flags.tot.t = tot.t != null ? Math.round(num(tot.t, 0, 1e7, 0)) : st.log.filter(e => e.k === 't').length;
  st.flags.tot.e = tot.e != null ? Math.round(num(tot.e, 0, 1e7, 0)) : st.log.filter(e => e.k === 'e').length;
  return st;
}

/* ==================== CUANDO TOCA CADA TAREA ==================== */
const parseSched = s => {
  if (s === 'd') return { t: 'dias', d: [0, 1, 2, 3, 4, 5, 6] };
  const p = s.split(':');
  if (p[0] === 'w') return { t: 'dias', d: p[1].split(',').map(Number) };
  return { t: 'cada', n: Number(p[1]), wd: p[2] != null ? Number(p[2]) : -1 };
};
function nextOnDays(days, from) {
  for (let i = 0; i < 7; i++) { const d = addDays(from, i); if (days.includes(wdOf(d))) return d; }
  return from;
}
function snapWd(s, wd) {
  for (const off of [0, -1, 1, -2, 2, -3, 3]) { const d = addDays(s, off); if (wdOf(d) === wd) return d; }
  return s;
}
const period = t => t.sched.t === 'dias' ? 7 / t.sched.d.length : t.sched.n;
function dueDate(t, today) {
  const sc = t.sched;
  let due;
  if (sc.t === 'dias') {
    if (!t.last) due = nextOnDays(sc.d, t.seed);
    else {
      /* hecha poco antes de su dia cuenta para ese dia; asi no se repite al dia siguiente */
      const minGap = Math.max(1, Math.floor(7 / sc.d.length / 2));
      due = nextOnDays(sc.d, addDays(t.last, minGap));
    }
  } else if (!t.last) due = t.seed;
  else {
    due = addDays(t.last, sc.n);
    if (sc.wd >= 0 && sc.n >= 7) due = snapWd(due, sc.wd);
  }
  if (!t.carry && due < today) due = sc.t === 'dias' ? nextOnDays(sc.d, today) : today;
  return due;
}
function taskState(t, today = todayStr()) {
  if (t.last === today) return { st: 'hecha', due: today, late: 0, inDays: 0 };
  const due = dueDate(t, today);
  if (due > today) return { st: 'ok', due, late: 0, inDays: diffDays(today, due) };
  if (due === today) return { st: 'hoy', due, late: 0, inDays: 0 };
  return { st: 'atrasada', due, late: diffDays(due, today), inDays: 0 };
}
function cond(t, today = todayStr()) {
  const s = taskState(t, today);
  if (s.st === 'hecha') return 1;
  if (s.st === 'ok') return 0.4 + 0.6 * Math.min(1, s.inDays / period(t));
  if (s.st === 'hoy') return 0.35;
  return Math.max(0, 0.25 - 0.08 * (s.late - 1));
}
function freqLabel(t) {
  const sc = t.sched;
  if (sc.t === 'dias') {
    if (sc.d.length === 7) return 'Todos los días';
    if (sc.d.join() === '0,1,2,3,4') return 'De lunes a viernes';
    if (sc.d.length === 1) return 'Cada ' + DAYS[sc.d[0]].toLowerCase();
    return sc.d.map(d => DAYS_S[d]).join(', ');
  }
  const n = sc.n;
  let s = n === 7 ? 'Cada semana' : n === 14 ? 'Cada 2 semanas' : n === 365 ? 'Cada año' : n % 30 === 0 ? (n === 30 ? 'Cada mes' : `Cada ${n / 30} meses`) : `Cada ${n} días`;
  if (sc.wd >= 0 && n >= 7) s += ', mejor el ' + DAYS[sc.wd].toLowerCase();
  return s;
}
function dueLabel(t, today = todayStr()) {
  const s = taskState(t, today);
  if (t.off) return 'En pausa';
  if (s.st === 'hecha') return 'Hecha hoy';
  if (s.st === 'hoy') return 'Toca hoy';
  if (s.st === 'atrasada') return 'Pendiente ' + pendLabel(s);
  if (s.inDays === 1) return 'Toca mañana';
  if (s.inDays < 7) return 'Toca el ' + DAYS[wdOf(s.due)].toLowerCase();
  return `Toca en ${s.inDays} días`;
}
const pendLabel = s => s.late === 1 ? 'desde ayer' : s.late < 7 ? 'desde el ' + DAYS[wdOf(s.due)].toLowerCase() : `desde hace ${s.late} días`;
const condLabel = c => c >= 0.8 ? 'Impecable' : c >= 0.6 ? 'Bien' : c >= 0.35 ? 'Regular' : 'Pide una mano';
const needLabel = c => c >= 0.8 ? 'Excelente' : c >= 0.6 ? 'Bien' : c >= 0.35 ? 'Regular' : 'Bajo';
const stClass = c => c >= 0.6 ? 'ok' : c >= 0.35 ? 'mid' : 'bad';
const roomById = id => S.rooms.find(r => r.id === id);
const taskById = id => S.tasks.find(t => t.id === id);
const taskByKey = k => S.tasks.find(t => t.key === k && !t.off);
function whereLabel(t) {
  if (t.area !== 'casa') return AREAS[t.area].e + ' ' + AREAS[t.area].n;
  const r = roomById(t.room);
  return r ? ROOM_TYPES[r.type].e + ' ' + r.name : '🏠 Toda la casa';
}

/* ==================== BLOQUES DEL DIA ==================== */
function blocksOf(wd) {
  const row = S.sched[wd], out = [];
  for (let h = 0; h < 24; h++) {
    const last = out[out.length - 1];
    if (last && last.type === row[h]) last.end = h + 1;
    else out.push({ type: row[h], start: h, end: h + 1 });
  }
  return out;
}
function slotBlock(wd, slot) {
  const of = type => blocksOf(wd).filter(b => b.type === type);
  switch (slot) {
    /* una rutina que empieza pasada la medianoche es la de la noche, no la de la manana */
    case 'manana': return of('rutina').find(b => b.start >= 4 && b.start < 12) || null;
    case 'noche': { const late = of('rutina').filter(b => b.start < 4), r = of('rutina').filter(b => b.start >= 17); return late.length ? late[late.length - 1] : r.length ? r[r.length - 1] : null; }
    case 'almuerzo': return of('comida').find(b => b.start >= 11 && b.start < 16) || null;
    case 'cena': { const c = of('comida').filter(b => b.start >= 16); return c.length ? c[c.length - 1] : null; }
    case 'tareas': return of('tareas')[0] || null;
    case 'ejercicio': return of('ejercicio')[0] || null;
  }
  return null;
}
function blockTitle(b) {
  if (b.type === 'rutina') return b.start >= 4 && b.start < 12 ? 'Rutina de la mañana' : 'Rutina de la noche';
  if (b.type === 'comida') return b.start < 16 ? 'Almuerzo' : 'Cena';
  return BT[b.type].n;
}
function sortItems(list, keepOrder) {
  list.sort((a, b) => {
    if (keepOrder) return a.t.ord - b.t.ord;
    const da = a.st === 'hecha', db = b.st === 'hecha';
    if (da !== db) return da ? 1 : -1;
    if ((a.st === 'atrasada') !== (b.st === 'atrasada')) return a.st === 'atrasada' ? -1 : 1;
    return a.t.min - b.t.min || a.t.ord - b.t.ord;
  });
}
function dayPlan(today = todayStr()) {
  const wd = wdOf(today), hard = S.hard === today;
  const map = new Map(), flex = [];
  for (const t of S.tasks) {
    if (t.off) continue;
    const s = taskState(t, today);
    if (s.st === 'ok') continue;
    if (hard && !t.ess && s.st !== 'hecha') continue;
    const item = { t, ...s };
    const b = slotBlock(wd, t.slot);
    if (!b) { flex.push(item); continue; }
    if (!map.has(b.start)) map.set(b.start, { block: b, items: [] });
    map.get(b.start).items.push(item);
  }
  const secs = [...map.values()].sort((a, b) => a.block.start - b.block.start);
  for (const s of secs) sortItems(s.items, s.block.type === 'rutina');
  sortItems(flex, false);
  const all = secs.flatMap(s => s.items).concat(flex);
  const pend = all.filter(i => i.st !== 'hecha');
  return { secs, flex, all, done: all.length - pend.length, total: all.length, minsLeft: pend.reduce((a, i) => a + i.t.min, 0), hard };
}

/* ==================== NECESIDADES, ANIMO Y RACHA ==================== */
function areaCond(area, roomId, today = todayStr()) {
  let w = 0, s = 0;
  for (const t of S.tasks) {
    if (t.off || t.area !== area) continue;
    if (roomId !== undefined && t.room !== roomId) continue;
    const wt = 1 + 6 / period(t);
    s += cond(t, today) * wt;
    w += wt;
  }
  return w ? s / w : 1;
}
const hasTasks = (area, roomId) => S.tasks.some(t => !t.off && t.area === area && (roomId === undefined || t.room === roomId));
function exMinutes(days = 7) {
  const from = addDays(todayStr(), -(days - 1));
  return S.log.reduce((a, e) => e.m > 0 && e.d >= from ? a + e.m : a, 0);
}
function needs() {
  const today = todayStr(), daysIn = diffDays(S.start, today) + 1;
  const mins = exMinutes(7), expect = S.settings.goal * clamp(daysIn, 1, 7) / 7;
  const ratio = expect > 0 ? mins / expect : 1;
  return { hogar: areaCond('casa'), comida: areaCond('cocina'), higiene: areaCond('aseo'), cuerpo: 0.3 + 0.7 * Math.min(1, ratio), ratio, mins, daysIn };
}
const dayCounts = () => S.flags.days;
function streak() {
  const counts = dayCounts(), hardSet = new Set(S.hardDays);
  const ok = d => (counts[d] || 0) >= 3 || (hardSet.has(d) && (counts[d] || 0) >= 1);
  let d = todayStr(), n = 0, miss = 0;
  if (ok(d)) n++;
  for (let i = 0; i < 1000; i++) {
    d = addDays(d, -1);
    if (d < S.start) break;
    if (ok(d)) { n++; miss = 0; }
    else if (++miss >= 2) break;
  }
  return n;
}
function moodInfo() {
  const today = todayStr(), n = needs(), hard = S.hard === today, th = [];
  const add = (v, t, act) => th.push({ v, t, act });
  if (!hasTasks('casa')) { /* sin tareas de la casa no hay pensamiento */ } else if (n.hogar >= 0.85) add(8, 'Mi base brilla'); else if (n.hogar >= 0.65) add(4, 'La casa está en orden');
  else if (n.hogar < 0.15) add(-8, 'La casa necesita un rescate', 'casa'); else if (n.hogar < 0.35) add(-4, 'La casa se está acumulando', 'casa');
  if (!hasTasks('cocina')) { /* sin tareas de comida no hay pensamiento */ } else if (n.comida >= 0.85) add(6, 'Estoy comiendo bien'); else if (n.comida >= 0.6) add(3, 'Comidas en orden'); else if (n.comida < 0.3) add(-5, 'Comiendo a deshoras', 'cocina');
  if (!hasTasks('aseo')) { /* sin tareas de aseo no hay pensamiento */ } else if (n.higiene >= 0.85) add(5, 'Aseo al día'); else if (n.higiene < 0.3) add(-5, 'Necesito una ducha', 'cuerpo');
  if (n.ratio >= 1) add(7, 'Meta de ejercicio cumplida'); else if (n.ratio >= 0.5) add(3, 'Me estoy moviendo');
  else if (n.ratio < 0.25 && n.daysIn >= 3) add(-3, 'Cuerpo oxidado', 'cuerpo');
  const cama = taskByKey('cama');
  if (cama && cama.last === today) add(2, 'Tendí la cama');
  const platos = taskByKey('platos');
  if (platos && platos.last && platos.last < addDays(today, -1) && diffDays(S.start, today) >= 2) add(-3, 'Platos de días anteriores', 'casa');
  const doneToday = S.log.filter(e => e.d === today && (e.k === 't' || e.k === 'w')).length;
  if (doneToday >= 3) add(Math.min(8, Math.floor(doneToday / 2) + 2), `Día productivo (${doneToday} tareas)`);
  const sk = streak();
  if (sk >= 2) add(Math.min(6, sk), `Racha de ${sk} días`);
  for (const e of S.ev.archive) if (e.status === 'hecho' && e.done && diffDays(e.done, today) <= 1) add(5, 'Superé: ' + e.title);
  let list = th;
  if (hard) { list = th.filter(x => x.v >= 0); list.push({ v: 0, t: 'Día difícil: hoy me cuido sin culpa' }); }
  list.sort((a, b) => b.v - a.v);
  const v = Math.round(clamp(50 + list.reduce((a, x) => a + x.v, 0), 0, 100));
  const label = v < 15 ? 'Al borde de un colapso' : v < 30 ? 'Estresado' : v < 45 ? 'Algo decaído' : v < 60 ? 'Tranquilo' : v < 75 ? 'Contento' : v < 90 ? 'Feliz' : 'Eufórico';
  return { v, label, thoughts: list, insp: v >= 80, streak: sk, needs: n };
}

/* ==================== EXPERIENCIA ==================== */
const lvlXP = L => 50 * L * (L + 1);
function levelOf(xp) { let L = 0; while (L < 20 && xp >= lvlXP(L + 1)) L++; return L; }
const totalXP = () => SKILL_IDS.reduce((a, k) => a + S.xp[k], 0);
function colonistTitle(total) {
  return total >= 20000 ? 'Leyenda del hogar' : total >= 8000 ? 'Veterano' : total >= 3000 ? 'Independiente' : total >= 1000 ? 'Aprendiz' : total >= 300 ? 'Novato' : 'Recién llegado';
}
function activeBonus() {
  const today = todayStr();
  const e = S.ev.active.find(x => x.bonus && x.status === 'activo' && x.exp >= today);
  return e ? e.bonus : null;
}
let pendingLevel = null;
function gainXP(skill, base) {
  let m = 1;
  if (S.settings.passions.includes(skill)) m *= 1.5;
  if (moodInfo().insp) m *= 1.25;
  const b = activeBonus();
  if (b && b.skill === skill) m *= b.mult;
  const before = levelOf(S.xp[skill]);
  const xp = Math.round(base * m);
  S.xp[skill] += xp;
  const after = levelOf(S.xp[skill]);
  if (after > before) pendingLevel = { skill, level: after };
  return xp;
}

const Snd = {
  ctx: null,
  ready() {
    if (!S.settings.sound) return false;
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      this.ctx = new AC();
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return true;
  },
  tone(f, dur, type, vol, when) {
    if (!this.ready()) return;
    const t = this.ctx.currentTime + (when || 0);
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type || 'square'; o.frequency.value = f;
    g.gain.setValueAtTime(vol || 0.08, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  },
  tick() { this.tone(880, 0.03, 'triangle', 0.04); },
  click() { this.tone(520, 0.05, 'triangle', 0.07); },
  done() { this.tone(784, 0.08, 'square', 0.06); this.tone(1175, 0.16, 'square', 0.06, 0.07); },
  bad() { this.tone(170, 0.2, 'sawtooth', 0.08); },
  bell() { [988, 1319, 988, 1319].forEach((f, i) => this.tone(f, 0.25, 'triangle', 0.09, i * 0.22)); },
  beep() { this.tone(660, 0.09, 'square', 0.06); },
  letter() { [523, 784, 1047].forEach((f, i) => this.tone(f, 0.12, 'triangle', 0.07, i * 0.1)); },
  win() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.17, 'square', 0.06, i * 0.09)); },
};

/* ==================== CREAR LA COLONIA ==================== */
function defaultCarry(t) {
  if (t.sched.t === 'cada') return true;
  if (t.sched.d.length === 7) return false;
  return t.area === 'casa' || (t.area === 'cocina' && t.slot === 'tareas');
}
function seedFor(t, today) {
  if (t.sched.t === 'dias') return today;
  const n = t.sched.n;
  let s = addDays(today, n <= 3 ? rand(n) : rand(Math.ceil(n * 0.75)));
  if (t.sched.wd >= 0 && n >= 7) s = snapWd(s, t.sched.wd);
  if (s < today) s = addDays(s, 7);
  return s;
}
/* una tarea nueva o reprogramada que nunca se hizo toca en su proximo dia, no en una fecha al azar */
function seedNew(t, today) {
  if (t.sched.t === 'dias') return today;
  return t.sched.wd >= 0 && t.sched.n >= 7 ? nextOnDays([t.sched.wd], today) : today;
}
let ordSeq = 0;
function newTaskFromTpl(tpl, area, room) {
  const today = todayStr();
  const t = { id: uid(), key: tpl.key, name: tpl.name, area, room, skill: tpl.skill, min: tpl.min, slot: tpl.slot, sched: parseSched(tpl.sched),
    carry: false, ess: !!tpl.ess, off: false, fb: !!tpl.fb, step: tpl.step || '', tip: tpl.tip || '', routine: tpl.routine || '', last: '', prev: '', seed: today, ord: ++ordSeq };
  t.carry = defaultCarry(t);
  t.seed = seedFor(t, today);
  return t;
}
function addRoomTasks(room) {
  const tpls = ROOM_TYPES[room.type].tasks;
  for (const tpl of tpls) {
    /* las tareas de lavanderia viven en "toda la casa" mientras no haya lavanderia: se mudan, no se duplican */
    const homeless = tpl.fb ? S.tasks.find(t => t.key === tpl.key && t.room === '' && t.area === 'casa') : null;
    if (homeless) homeless.room = room.id;
    else S.tasks.push(newTaskFromTpl(tpl, 'casa', room.id));
  }
}
function makeEvent(def, today = todayStr()) {
  const steps = [];
  for (const s of def.steps || []) {
    if (s[0] === 'k') {
      const t = taskByKey(s[1]);
      if (t) steps.push({ t: t.room ? `${t.name} (${roomById(t.room).name})` : t.name, task: t.id, x: '', done: t.last === today });
    } else if (s[0] === 'x') steps.push({ t: s[2], task: '', x: s[1], done: false });
    else steps.push({ t: s[1], task: '', x: '', done: false });
  }
  if ((def.steps || []).length && !steps.length) return null;
  return { id: uid(), key: def.key, e: def.e, kind: def.kind, title: def.title, text: def.text, steps, xp: def.xp, skill: def.skill || 'orden',
    created: today, exp: addDays(today, (def.days || 1) - 1), status: def.auto ? 'activo' : 'nuevo', bonus: def.bonus || null, done: '' };
}
function setupColony(o) {
  const today = todayStr();
  const sound = S.settings.sound;
  S = defaultState();
  S.settings.sound = sound;
  S.settings.name = o.name.trim().slice(0, 24) || 'Colono';
  S.settings.avatar = o.avatar;
  S.settings.passions = o.passions.slice(0, 2);
  S.settings.narr = o.narr;
  S.start = today;
  S.sched = SCHED_TPL[o.sched].make();
  ordSeq = 0;
  for (const [type, name, x, y, w, h] of PLAN_TPL[o.plan].rooms) S.rooms.push({ id: uid(), type, name, x, y, w, h });
  for (const tpl of GENERAL_TASKS) S.tasks.push(newTaskFromTpl(tpl, 'casa', ''));
  if (!S.rooms.some(r => r.type === 'lavanderia')) for (const tpl of ROOM_TYPES.lavanderia.tasks) S.tasks.push(newTaskFromTpl(tpl, 'casa', ''));
  for (const r of S.rooms) addRoomTasks(r);
  for (const area of ['cocina', 'aseo', 'ejercicio']) for (const tpl of AREA_TASKS[area]) S.tasks.push(newTaskFromTpl(tpl, area, ''));
  /* el primer dia no arranca con bloques que ya pasaron: esas tareas empiezan manana */
  const wd = wdOf(today), h = nowHour();
  for (const t of S.tasks) {
    if (t.sched.t !== 'dias' && t.seed !== today) continue;
    const b = slotBlock(wd, t.slot);
    if (b && b.end <= h) t.seed = addDays(today, 1);
  }
  S.ev.lastRoll = today;
  for (const def of o.messy ? [EV_WELCOME, EV_RESCUE] : [EV_WELCOME]) { const ev = makeEvent(def, today); if (ev) S.ev.active.push(ev); }
  S.settings.onboarded = true;
  persist();
}

/* ==================== COMPLETAR TAREAS ==================== */
function trimLog() { if (S.log.length > 3000) S.log.splice(0, S.log.length - 3000); }
/* contadores que no dependen del historial recortado: totales y tareas por dia para la racha */
function bump(e, sign) {
  const f = S.flags;
  if (e.k === 't' || e.k === 'w') { f.days[e.d] = Math.max(0, (f.days[e.d] || 0) + sign); if (!f.days[e.d]) delete f.days[e.d]; }
  if (e.k === 't') f.tot.t = Math.max(0, f.tot.t + sign);
  if (e.k === 'e') f.tot.e = Math.max(0, f.tot.e + sign);
}
function pushLog(e) { S.log.push(e); bump(e, 1); trimLog(); }
function dropLog(i) {
  const e = S.log[i];
  S.log.splice(i, 1);
  bump(e, -1);
  S.xp[e.s] = Math.max(0, S.xp[e.s] - e.xp);
  return e;
}
function completeTask(t, o = {}) {
  const today = todayStr();
  if (!t || t.last === today) return null;
  t.prev = t.last;
  t.last = today;
  const m = t.area === 'ejercicio' ? Math.round(o.m != null ? o.m : t.min) : 0;
  const xp = gainXP(t.skill, 5 + Math.min(60, t.area === 'ejercicio' ? m : t.min));
  const entry = { id: uid(), d: today, ts: Date.now(), k: 't', ref: t.id, n: t.name, s: t.skill, xp, m, r: t.routine || '' };
  pushLog(entry);
  if (S.work && S.work.tid === t.id) S.work = null;
  /* la copia se toma con la tarea ya anotada: deshacer revierte justo los eventos que cerro esta accion */
  const evSnap = JSON.stringify(S.ev);
  progressEvents({ task: t, workout: m, ...(o.ctx || {}) });
  afterAction();
  floatText('+' + xp + ' XP', '#ffd98a');
  Snd.done();
  toast(`✓ ${esc(t.name)} · +${xp} XP de ${SKILLS[t.skill].n}`, { label: 'Deshacer', fn() { undoEntry(entry.id, evSnap); } });
  announce();
  return entry;
}
function reopenEventsFor(e) {
  for (const ev of S.ev.active) for (const st of ev.steps) if (st.task === e.ref) st.done = false;
  for (const ev of S.ev.archive.filter(x => x.status === 'hecho' && x.done === e.d && x.steps.some(st => st.task === e.ref))) {
    for (const st of ev.steps) if (st.task === e.ref) st.done = false;
    const k = S.log.findIndex(x => x.k === 'e' && x.ref === ev.key && x.d === e.d);
    if (k >= 0) dropLog(k);
    ev.status = 'activo';
    ev.done = '';
    S.ev.archive.splice(S.ev.archive.indexOf(ev), 1);
    S.ev.active.push(ev);
  }
}
function undoEntry(entryId, evSnap) {
  const i = S.log.findIndex(e => e.id === entryId);
  if (i < 0) return;
  const e = dropLog(i);
  if (evSnap) {
    for (let k = S.log.length - 1; k >= 0; k--) if (S.log[k].k === 'e' && S.log[k].ts >= e.ts) dropLog(k);
    try { S.ev = JSON.parse(evSnap); } catch (_) { /* copia ilegible: se deja el estado actual */ }
  } else if (e.k === 't') reopenEventsFor(e);
  if (e.k === 't') {
    const t = taskById(e.ref);
    if (t && t.last === e.d) { t.last = t.prev || ''; t.prev = ''; if (!t.last) t.seed = e.d; }
  } else if (e.k === 'r' && S.cooked[e.ref]) {
    if (--S.cooked[e.ref] <= 0) delete S.cooked[e.ref];
  }
  if (e.d === todayStr() && S.flags.fullDays.includes(e.d)) {
    const p = dayPlan();
    if (p.done !== p.total) S.flags.fullDays = S.flags.fullDays.filter(d => d !== e.d);
  }
  persist();
  refresh();
}
function toggleTask(id) {
  const t = taskById(id);
  if (!t) return;
  const today = todayStr();
  if (t.last === today) {
    const e = [...S.log].reverse().find(x => x.k === 't' && x.ref === id && x.d === today);
    if (e) { undoEntry(e.id); toast('Desmarcada'); }
    else { t.last = t.prev || ''; t.prev = ''; if (!t.last) t.seed = today; persist(); refresh(); }
    return;
  }
  completeTask(t);
}
function afterAction() {
  const today = todayStr(), plan = dayPlan(today);
  if (plan.total >= 5 && plan.done === plan.total && !S.flags.fullDays.includes(today)) {
    S.flags.fullDays.push(today);
    progressEvents({ allday: true });
    setTimeout(() => { confetti(); Snd.win(); showAch('☀️', 'Día completo', '¡Hiciste todo tu plan de hoy!'); }, 400);
  }
  if (S.log.filter(e => e.d === today && (e.k === 't' || e.k === 'w')).length >= 5) progressEvents({ five: true });
  const man = plan.secs.find(s => s.block.type === 'rutina' && s.block.start < 12);
  if (man && man.items.length && man.items.every(i => i.st === 'hecha')) progressEvents({ routineManana: true });
  checkAch();

  refresh();
}
function announce() {

/* ==================== EVENTOS DEL NARRADOR ==================== */
function rollEvents() {
  const today = todayStr();
  for (const e of S.ev.active) if (e.exp < today) { e.status = 'vencido'; S.ev.archive.push(e); }
  S.ev.active = S.ev.active.filter(e => e.exp >= today);
  S.ev.archive = S.ev.archive.slice(-60);
  if (S.ev.lastRoll === today || !S.settings.onboarded) return;
  S.ev.lastRoll = today;
  const nar = NARR[S.settings.narr];
  if (S.ev.active.filter(e => e.kind !== 'mision').length >= nar.max || Math.random() > nar.p) return;
  const recent = new Set(S.ev.archive.slice(-8).map(e => e.key).concat(S.ev.active.map(e => e.key)));
  const pool = EVENTS.filter(d => !recent.has(d.key) && (!d.caos || S.settings.narr === 'caos') && (!d.calmaNo || S.settings.narr !== 'calma'));
  for (const def of shuffle(pool)) {
    const ev = makeEvent(def, today);
    if (ev) { S.ev.active.push(ev); setTimeout(() => Snd.letter(), 600); break; }
  }
}
function progressEvents(ctx) {
  for (const ev of S.ev.active) {
    if (ev.bonus) continue;
    let changed = false;
    for (const st of ev.steps) {
      if (st.done) continue;
      const hit = (ctx.task && st.task && st.task === ctx.task.id)
        || (st.x === 'first-task' && ctx.task)
        || (st.x === 'recipe' && ctx.recipe)
        || (st.x === 'recipe-new' && ctx.recipe && ctx.isNew)
        || (st.x === 'workout' && ctx.workout >= 20)
        || (st.x === 'timer10' && ctx.timer10)
        || (st.x === 'allday' && ctx.allday)
        || (st.x === 'routine-manana' && ctx.routineManana)
        || (st.x === 'five' && ctx.five)
        || (st.x && st.x === ctx.special);
      if (hit) { st.done = true; changed = true; }
    }
    if (changed && ev.status === 'activo' && ev.steps.length && ev.steps.every(s => s.done)) finishEvent(ev);
  }
}
function finishEvent(ev) {
  const today = todayStr();
  ev.status = 'hecho';
  ev.done = today;
  const xp = ev.xp ? gainXP(ev.skill, ev.xp) : 0;
  if (xp) pushLog({ id: uid(), d: today, ts: Date.now(), k: 'e', ref: ev.key, n: ev.title, s: ev.skill, xp, m: 0, r: '' });
  S.ev.active = S.ev.active.filter(e => e !== ev);
  S.ev.archive.push(ev);
  setTimeout(() => { confetti(60); Snd.win(); showAch(ev.e, 'Evento superado', `${ev.title}${xp ? ' · +' + xp + ' XP' : ''}`); }, 500);
}
function acceptEvent(ev) {
  ev.status = 'activo';
  if (ev.steps.length && ev.steps.every(s => s.done)) finishEvent(ev);
  checkAch();
  persist();
  refresh();
  announce();
}
function ignoreEvent(ev) {
  ev.status = 'ignorado';
  S.ev.active = S.ev.active.filter(e => e !== ev);
  S.ev.archive.push(ev);
  persist();
  refresh();
}
function special(key) {

function mealLabel(val) {

function setMeal(date, slot, val) {
  const day = S.menu[date] || {};
  if (val) day[slot] = val; else delete day[slot];
  if (Object.keys(day).length) S.menu[date] = day; else delete S.menu[date];
  if (val) special('menu-set');

/* en fin de semana se planifica la semana que viene */
const planWeek = () => { const t = todayStr(); return weekStart(wdOf(t) >= 5 ? addDays(t, 7) : t); };
function autoWeek(ws) {
  const lote = shuffle(RECIPES.filter(r => r.tags.includes('lote') && !r.tags.includes('base') && !r.tags.includes('desayuno')));
  const quick = shuffle(RECIPES.filter(r => (r.tags.includes('rapida') || r.tags.includes('cena')) && !r.tags.includes('desayuno') && !r.tags.includes('lote')));
  let li = 0, qi = 0, last = null, uses = 0, filled = 0;
  for (let i = 0; i < 7; i++) {
    const d = addDays(ws, i);
    if (d < todayStr()) continue;
    const day = S.menu[d] || {};
    if (!day.a) {
      if (last && uses < 2) { day.a = 't:Sobras de ' + last.n.toLowerCase(); uses++; }
      else { last = lote[li++ % lote.length]; uses = 0; day.a = 'r:' + last.id; }
      filled++;
    }
    if (!day.c) { day.c = 'r:' + quick[qi++ % quick.length].id; filled++; }
    S.menu[d] = day;
  }
  if (filled) special('menu-set');
  persist();
  return filled;
}
function addShop(name, q, u, sec) {
  name = String(name).trim().slice(0, 40);
  if (!name) return false;
  const k = name.toLowerCase();
  const ex = S.shop.filter(i => !i.done && i.n.toLowerCase() === k);
  if (!q) { if (ex.length) return false; S.shop.push({ id: uid(), n: name, q: 0, u: '', sec: sec || guessSec(name), done: false }); return true; }
  const zero = ex.find(i => !i.q);
  if (zero) { zero.q = q; zero.u = u; return true; }
  const same = ex.find(i => i.u === u);
  if (same) { same.q = Math.round((same.q + q) * 100) / 100; return true; }
  S.shop.push({ id: uid(), n: name, q, u, sec: sec || guessSec(name), done: false });
  return true;
}
function addRecipeToShop(r) {
  let n = 0;
  for (const [name, q, u, sec] of r.ing) if (addShop(name, q, u, sec)) n++;
  return n;
}
function weekToShop(ws) {
  let n = 0, meals = 0, already = 0;
  for (let i = 0; i < 7; i++) {
    const d = addDays(ws, i);
    if (d < todayStr()) continue;
    const day = S.menu[d] || {};
    for (const sl of ['a', 'c']) {
      const v = day[sl];
      if (!v || !v.startsWith('r:')) continue;
      const r = recipeById(v.slice(2));
      if (!r) continue;
      /* cada comida pasa a la lista una sola vez, aunque toques el boton de nuevo */
      if (S.shopped[d + '|' + sl] === v) { already++; continue; }
      S.shopped[d + '|' + sl] = v;
      n += addRecipeToShop(r);
      meals++;
    }
  }
  persist();
  return { n, meals, already };
}

const skipped = new Set();
let showNext = false;
function nextAction(plan) {
  const h = nowHour();
  const pend = s => s.items.filter(i => i.st !== 'hecha' && !skipped.has(i.t.id));
  const upcoming = () => plan.secs.find(s => s.block.start > h && pend(s).length);
  if (showNext) { const up = upcoming(); if (up) return { item: pend(up)[0], sec: up, early: true }; }
  const curB = blocksOf(wdOf(todayStr())).find(b => b.start <= h && h < b.end);
  /* mientras duermes o trabajas no se sugiere nada de la casa */
  if (curB && (curB.type === 'dormir' || curB.type === 'trabajo')) return { item: null, up: upcoming(), rest: curB.type };
  const cur = plan.secs.find(s => s.block.start <= h && h < s.block.end);
  const out = [];
  if (cur) out.push(...pend(cur));
  /* de lo que ya paso solo vuelven las tareas: comidas y rutinas tienen su hora */
  const past = plan.secs.filter(s => s !== cur && s.block.end <= h && !['rutina', 'comida'].includes(s.block.type)).flatMap(pend);
  sortItems(past, false);
  out.push(...past);
  if (!cur || ['libre', 'tareas'].includes(cur.block.type)) out.push(...plan.flex.filter(i => i.st !== 'hecha' && !skipped.has(i.t.id)));
  if (!out.length) return { item: null, up: upcoming() };
  const item = out[0];
  return { item, sec: plan.secs.find(s => s.items.includes(item)) || null };
}

    const k = t.area === 'casa' ? 'room:' + (t.room || '_') : 'area:' + t.area;

    out.push({ a: k, t: `${label}: ${n} ${n === 1 ? 'pendiente' : 'pendientes'}`, s: 'Ver', c: '#ff8a5a' });
  }
  const ws = planWeek();

  for (let i = 0; i < 7; i++) { const d = S.menu[addDays(ws, i)]; if (d) meals += Object.keys(d).length; }
  if (!meals) out.push({ a: 'tab:cocina', t: '🍳 Aún no tienes menú esta semana', s: 'Armar', c: '#f0a03a' });
  const compras = taskByKey('compras'), pendShop = S.shop.filter(i => !i.done).length;

  return out.slice(0, 6);
}

function deleteRoom(r) {
  const removed = [], moved = [];
  const sameType = S.rooms.some(x => x.id !== r.id && x.type === r.type);
  for (const t of S.tasks) {
    if (t.room !== r.id) continue;
    if (t.fb && !sameType) { t.room = ''; moved.push(t); } else removed.push(t);
  }
  const idx = S.rooms.indexOf(r);
  S.rooms.splice(idx, 1);
  S.tasks = S.tasks.filter(t => !removed.includes(t));
  CA.sel = '';
  persist();
  renderCasa();
  toast(`Borraste ${esc(r.name)}`, { label: 'Deshacer', fn() {
    if (roomById(r.id)) return;
    if (overlaps(r, r.id)) {
      const spot = freeSpot([[r.w, r.h], [3, 3], [2, 2]]);
      if (spot) Object.assign(r, spot);
      else {
        for (const t of removed) if (!taskById(t.id)) { t.room = ''; S.tasks.push(t); }
        persist(); refresh();
        toast('No había espacio para el cuarto: sus tareas quedaron en Toda la casa');
        return;
      }
    }
    S.rooms.splice(Math.min(idx, S.rooms.length), 0, r);
    for (const t of moved) t.room = r.id;
    for (const t of removed) if (!taskById(t.id)) S.tasks.push(t);
    persist();
    refresh();
  } });
}
function freeSpot(sizes) {
  for (const [w, h] of sizes) for (let y = 0; y + h <= PLAN_H; y++) for (let x = 0; x + w <= PLAN_W; x++) {
    const n = { x, y, w, h };
    if (!overlaps(n, '')) return n;
  }

}
function addRoom(type) {
  const sizes = [[4, 3], [3, 3], [3, 2], [2, 2]];
  for (const [w, h] of sizes) for (let y = 0; y + h <= PLAN_H; y++) for (let x = 0; x + w <= PLAN_W; x++) {
    const n = { x, y, w, h };
    if (overlaps(n, '')) continue;
    const r = { id: uid(), type, name: ROOM_TYPES[type].n, ...n };
    S.rooms.push(r);
    addRoomTasks(r);
    CA.sel = r.id;
    persist();
    closeModal();
    refresh();
    toast(`${ROOM_TYPES[type].e} ${ROOM_TYPES[type].n} agregado con sus tareas`);

}

    </div>`;
  }
  const dailyNames = S.tasks.filter(t => !t.off && t.slot === 'tareas' && ((t.sched.t === 'dias' && t.sched.d.length === 7) || (t.sched.t === 'cada' && t.sched.n <= 3))).map(t => esc(t.name));

  $$('[data-move]', $('#sm-days')).forEach(sel => sel.addEventListener('change', () => {

    if (again) again.focus({ preventScroll: true });

  special('visit-semana');
}
const gridEl = $('#sm-grid');
function paintCell(el) {
  const d = Number(el.dataset.d), h = Number(el.dataset.h);
  if (S.sched[d][h] === SM.brush) return;
  S.sched[d][h] = SM.brush;
  el.style.background = BT[SM.brush].c;
  el.textContent = '';
  SM.dirty = true;
}
gridEl.addEventListener('pointerdown', e => {
  if (!SM.edit) return;
  const c = e.target.closest('.sc');
  if (!c) return;
  e.preventDefault();
  SM.painting = true;
  try { gridEl.setPointerCapture(e.pointerId); } catch (_) { /* puntero ya liberado */ }
  paintCell(c);
});
gridEl.addEventListener('pointermove', e => {
  if (!SM.painting) return;
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const c = el && el.closest && el.closest('.sc');
  if (c && gridEl.contains(c)) paintCell(c);
});
const stopPaint = () => {
  if (!SM.painting) return;
  SM.painting = false;
  if (SM.dirty) { SM.dirty = false; persist(); renderSemana(); }
};
gridEl.addEventListener('pointerup', stopPaint);
gridEl.addEventListener('pointercancel', stopPaint);

    } else {
      const n = Math.round(parseFloat($('#te-n', mc).value));
      if (!(n >= 2 && n <= 730)) { Snd.bad(); toast('Cada cuántos días: un número entre 2 y 730'); return; }

      nt.seed = seedNew(nt, today);
      S.tasks.push(nt);

    if (back) back(); else closeModal();

/* ==================== VENTANA: RUTINA GUIADA ==================== */
let woTimer = null;
function openWorkout(rid) {
  const r = ROUTINES[rid];
  if (!r) return;
  const seq = [];
  const push = (it, phase) => seq.push({ ...it, phase });
  r.warm.forEach(it => push(it, 'Calentamiento'));
  for (let k = 0; k < r.rounds; k++) r.items.forEach((it, i) => {
    push(it, r.rounds > 1 ? `Ronda ${k + 1} de ${r.rounds}` : 'Rutina');
    const last = k === r.rounds - 1 && i === r.items.length - 1;
    if (r.rest && !last) {
      const nx = i + 1 < r.items.length ? r.items[i + 1] : r.items[0];
      seq.push({ n: 'Descanso', s: r.rest, cue: 'Siguiente: ' + nx.n, rest: true, phase: 'Descanso' });
    }
  });
  r.cool.forEach(it => push(it, 'Vuelta a la calma'));
  const W = { i: -1, stepStart: 0, pausedAt: 0, pausedStep: 0, pausedAll: 0, t0: 0, beeped: -1 };
  const mc = openModal('', { locked: true });
  const left = () => {
    const st = seq[W.i];
    if (!st || !st.s) return null;
    const now = W.pausedAt || Date.now();
    return Math.max(0, Math.ceil(st.s - (now - W.stepStart - W.pausedStep) / 1000));
  };
  function draw() {
    if (W.i < 0) {
      mc.innerHTML = `<div class="wo"><div style="font-size:3rem">${r.e}</div><div class="wo-name">${esc(r.n)}</div>
        <p class="wo-cue">${esc(r.d)} Dura unos ${r.min} minutos: ${r.items.length} ejercicios${r.rounds > 1 ? ` en ${r.rounds} rondas` : ''}${r.warm.length ? ', más calentamiento' : ''}. Te guío paso a paso con temporizador.</p></div>
        <div class="modal-actions"><button type="button" class="btn dark" id="wo-out">Salir</button><button type="button" class="btn gold big" id="wo-go">▶ Empezar</button></div>`;
      $('#wo-out', mc).addEventListener('click', stop);
      $('#wo-go', mc).addEventListener('click', () => { W.t0 = Date.now(); go(0); });
      return;
    }
    const st = seq[W.i], l = left();
    mc.innerHTML = `<div class="wo ${st.rest ? 'rest' : ''}"><div class="wo-phase">${esc(st.phase)}</div>
      <div class="wo-name">${esc(st.n)}</div>
      ${st.s ? `<div class="big-time" id="wo-t">${mmss(l)}</div>` : `<div class="wo-reps">${esc(st.r)}</div>`}
      <p class="wo-cue">${esc(st.cue)}</p>
      <div class="wo-dots">${seq.map((s, k) => `<i class="${k < W.i ? 'done' : k === W.i ? 'cur' : ''}"></i>`).join('')}</div></div>
      <div class="modal-actions">
        <button type="button" class="btn dark" id="wo-quit">Salir sin guardar</button>
        <button type="button" class="btn dark" id="wo-end">Terminar y guardar</button>
        ${st.s ? `<button type="button" class="btn dark" id="wo-pause">${W.pausedAt ? '▶ Seguir' : '⏸ Pausa'}</button>` : ''}
        <button type="button" class="btn gold" id="wo-next">${st.rest ? 'Saltar descanso' : st.s ? 'Siguiente' : '✓ Hecho'}</button>
      </div>`;
    armConfirm($('#wo-quit', mc), '¿Seguro? Toca otra vez', stop);
    $('#wo-end', mc).addEventListener('click', finish);
    $('#wo-next', mc).addEventListener('click', () => go(W.i + 1));
    const p = $('#wo-pause', mc);
    if (p) p.addEventListener('click', () => {
      if (W.pausedAt) { const d = Date.now() - W.pausedAt; W.pausedStep += d; W.pausedAll += d; W.pausedAt = 0; }
      else W.pausedAt = Date.now();
      draw();
      const pb = $('#wo-pause', mc);
      if (pb) pb.focus({ preventScroll: true });
    });
  }
  function go(i) {
    if (W.pausedAt) { const d = Date.now() - W.pausedAt; W.pausedAll += d; W.pausedAt = 0; }
    if (i >= seq.length) { finish(); return; }
    W.i = i; W.stepStart = Date.now(); W.pausedStep = 0; W.beeped = -1;
    Snd.click();
    draw();
    const nb = $('#wo-next', mc);
    if (nb) nb.focus({ preventScroll: true });
  }
  function tick() {
    if (!modal || W.i < 0 || W.pausedAt) return;
    const l = left();
    if (l === null) return;
    const el = $('#wo-t', mc);
    if (el) el.textContent = mmss(l);
    if (l <= 3 && l > 0 && W.beeped !== l) { W.beeped = l; Snd.beep(); }
    if (l === 0) go(W.i + 1);
  }
  function stop() { clearInterval(woTimer); woTimer = null; closeModal(); }
  function finish() {
    const ms = Date.now() - W.t0 - W.pausedAll - (W.pausedAt ? Date.now() - W.pausedAt : 0);
    stop();
    if (W.i < 0) return;
    const mins = Math.max(1, Math.round(ms / 60000));
    logActivity(mins, r.n, rid);
    confetti(40);
  }
  clearInterval(woTimer);
  woTimer = setInterval(tick, 250);
  draw();
}

function readBackup(file) {
  if (file.size > 20 * 1024 * 1024) { toast('Ese archivo es demasiado grande'); return; }
  const rd = new FileReader();
  rd.onload = () => {
    let o = null;
    try { o = JSON.parse(rd.result); } catch (_) { o = null; }
    if (!o || o.v !== 1 || !Array.isArray(o.tasks) || !o.settings) { Snd.bad(); toast('Ese archivo no es un respaldo de Colonia'); return; }
    const st = sanitizeState(o);
    const mc = openModal(`<h3>¿Cargar este respaldo?</h3>
      <p class="muted">Trae a ${esc(st.settings.name || 'tu colono')} con ${st.tasks.length} tareas y ${st.log.length} registros. <b style="color:#fff">Reemplaza todo lo que tienes ahora.</b></p>
      <div class="modal-actions"><button type="button" class="btn dark" id="rs-no">Cancelar</button><button type="button" class="btn gold big" id="rs-ok">Sí, cargar</button></div>`);
    $('#rs-no', mc).addEventListener('click', closeModal);
    $('#rs-ok', mc).addEventListener('click', () => {
      st.settings.onboarded = true;
      S = st;
      ordSeq = Math.max(0, ...S.tasks.map(t => t.ord));
      rollEvents();
      persist(); closeModal(); refresh(); toast('Respaldo cargado ✓');
    });
  };
  rd.onerror = () => toast('No pude leer el archivo');
  rd.readAsText(file);
}

let curTab = 'hoy';
function showTab(t) {
  curTab = t;
  $$('.tab').forEach(s => s.classList.toggle('active', s.id === 'tab-' + t));
  showNext = false;
  refresh();

const FOCUS_ATTRS = ['data-chk', 'data-start', 'data-task', 'data-act', 'data-kit', 'data-move', 'data-room', 'data-rcp', 'data-meal', 'data-shop', 'data-routine', 'data-sub', 'data-tab', 'data-ev', 'data-alert'];
function focusKey() {
  const a = document.activeElement;
  if (!a || a === document.body || !a.hasAttribute) return null;
  if (a.id) return '#' + CSS.escape(a.id);
  /* el mismo data-chk puede estar en la Siguiente accion y en la lista: se busca dentro del mismo contenedor */
  const box = a.parentElement && a.parentElement.closest('[id]');
  const pre = box && box.id !== 'app' ? '#' + CSS.escape(box.id) + ' ' : '';
  for (const k of FOCUS_ATTRS) if (a.hasAttribute(k)) return pre + `[${k}="${CSS.escape(a.getAttribute(k))}"]`;
  return null;
}
function restoreFocus(key) {
  if (!key || (document.activeElement && document.activeElement !== document.body)) return;
  const el = document.querySelector(modal && !key.startsWith('#modal-box') ? '#modal-box ' + key : key);
  if (el) el.focus({ preventScroll: true });
}
/* redibujar no debe dejar el foco del teclado tirado en el body */
function refresh() {
  const fk = focusKey();
  renderHeader();
  if (curTab === 'hoy') renderHoy();
  else if (curTab === 'casa') renderCasa();
  else if (curTab === 'cocina') renderCocina();
  else if (curTab === 'cuerpo') renderCuerpo();
  else if (curTab === 'semana') renderSemana();
  tickWork();
  if (modal && modal.redraw) modal.redraw();
  restoreFocus(fk);
}

document.addEventListener('click', e => {
  const el = e.target.closest && e.target.closest('[data-tab],[data-act],[data-chk],[data-task],[data-start],[data-ev],[data-alert],[data-room],[data-rcp],[data-meal],[data-routine],[data-shop],[data-shopdel],[data-brush],[data-sub]');
  if (!el) return;
  const d = el.dataset;
  if (d.tab) { Snd.click(); showTab(d.tab); }
  else if (d.chk) toggleTask(d.chk);
  else if (d.task) { const t = taskById(d.task); if (t) openTaskInfo(t, modal && modal.reopen); }
  else if (d.start) { const t = taskById(d.start); if (t) { if (t.routine) openWorkout(t.routine); else startWork(t); } }
  else if (d.ev) { Snd.letter(); openEvent(d.ev); }
  else if (d.alert) {
    const a = d.alert;
    if (a.startsWith('room:')) openRoom(a.slice(5));
    else if (a.startsWith('area:')) openRoom(a);
    else if (a === 'shop') { CK.sub = 'compras'; showTab('cocina'); }
    else if (a === 'ajustes') openAjustes();
    else if (a.startsWith('tab:')) { const tb = a.slice(4); if (tb === 'cocina') CK.sub = 'menu'; showTab(tb); }
  }
  else if (d.room) {
    if (!CA.edit || el.classList.contains('rcard')) openRoom(d.room);
    else if (CA.sel !== d.room) { CA.sel = d.room; renderCasa(); const r2 = $(`#plan [data-room="${CSS.escape(d.room)}"]`); if (r2) r2.focus({ preventScroll: true }); }
  }
  else if (d.rcp) openRecipe(d.rcp);
  else if (d.meal) { const [dt, sl] = d.meal.split('|'); openMealPicker(dt, sl); }
  else if (d.routine) openWorkout(d.routine);
  else if (d.shop) toggleShop(d.shop);
  else if (d.shopdel) { S.shop = S.shop.filter(i => i.id !== d.shopdel); persist(); renderCocina(); }
  else if (d.brush) { SM.brush = d.brush; Snd.tick(); renderSemana(); }
  else if (d.sub) {
    if (el.closest('#ck-seg')) { CK.sub = d.sub; renderCocina(); }
    else if (el.closest('#cu-seg')) { CU.sub = d.sub; renderCuerpo(); }
  }
  else if (d.act) doAct(d.act, el);
});
function doAct(a, el) {
  switch (a) {
    case 'inspect': openInspector(); break;
    case 'manual': openManual(); break;
    case 'ajustes': openAjustes(); break;
    case 'work': openWork(); break;
    case 'skip': skipped.add(el.dataset.id); showNext = false; if (!nextAction(dayPlan()).item) skipped.clear(); refresh(); break;
    case 'early': showNext = true; refresh(); break;
    case 'hard': {
      const today = todayStr();
      if (S.hard === today) { S.hard = ''; S.hardDays = S.hardDays.filter(d => d !== today); toast('Volviste al plan completo'); }
      else { S.hard = today; if (!S.hardDays.includes(today)) S.hardDays.push(today); toast('🫶 Hoy solo lo esencial. Cuídate.'); }
      checkAch(); persist(); refresh(); break;
    }
    case 'reset10': startWork(null); break;
    case 'tip': tipIdx++; Snd.click(); refresh(); break;
    case 'edit-plan': CA.edit = !CA.edit; CA.sel = ''; renderCasa(); break;
    case 'add-room': openAddRoom(); break;
    case 'wk-prev': CK.week = addDays(CK.week, -7); renderCocina(); break;
    case 'wk-next': CK.week = addDays(CK.week, 7); renderCocina(); break;
    case 'auto-week': { const n = autoWeek(CK.week); Snd.win(); renderCocina(); toast(n ? `Llené ${n} comidas. Cambia las que quieras tocándolas.` : 'La semana ya estaba completa'); break; }
    case 'week-shop': {
      const r = weekToShop(CK.week || weekStart(todayStr()));
      if (!r.meals && r.already) toast('Ya pasaste este menú a la lista. Si cambias una comida, vuelve a tocar el botón.');
      else if (!r.meals) toast('Primero elige recetas en el menú de la semana');
      else { toast(`Pasé ${r.n} ingredientes de ${r.meals} comidas a la lista`); CK.sub = 'compras'; renderCocina(); }
      break;
    }
    case 'clear-week': {
      const ws = CK.week, old = {};
      for (let k = 0; k < 7; k++) { const dd = addDays(ws, k); if (S.menu[dd]) { old[dd] = S.menu[dd]; delete S.menu[dd]; } }
      persist(); renderCocina();
      if (Object.keys(old).length) toast('Semana vaciada', { label: 'Deshacer', fn() { Object.assign(S.menu, old); persist(); refresh(); } });
      break;
    }
    case 'shop-clean': { const n = S.shop.filter(i => i.done).length; S.shop = S.shop.filter(i => !i.done); persist(); renderCocina(); toast(n ? `Quité ${n} ${n === 1 ? 'cosa comprada' : 'cosas compradas'}` : 'No había nada comprado'); break; }
    case 'new-task': openTaskEdit(null, { area: el.dataset.area || 'casa' }); break;
    case 'activity': openActivity(); break;
    case 'edit-sched': SM.edit = !SM.edit; renderSemana(); break;
    case 'copy-monday': {
      const old = S.sched.map(r => r.slice());
      for (let k = 1; k <= 4; k++) S.sched[k] = S.sched[0].slice();
      persist(); renderSemana();
      toast('Copié el lunes a los demás días de semana', { label: 'Deshacer', fn() { S.sched = old; persist(); refresh(); } });
      break;
    }
  }
}
$('#app').addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=button]')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('keydown', e => {
  if (!modal) return;
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if (e.key === 'Escape' && !modal.locked) { e.preventDefault(); closeModal(); return; }
  if (modal.onKey) modal.onKey(e, typing);
});
window.addEventListener('storage', e => {
  if (e.key !== KEY || !e.newValue) return;
  try {
    S = sanitizeState(JSON.parse(e.newValue));
    const had = !!modal;
    if (had && !modal.locked) closeModal();
    refresh();
    toast(had ? 'Se actualizó con cambios de otra pestaña. Vuelve a abrir lo que estabas viendo.' : 'Se actualizó con cambios de otra pestaña.');
  } catch (_) { /* cambio ilegible desde otra pestaña */ }
});
document.addEventListener('pointerdown', () => Snd.ready(), { once: true });
document.addEventListener('visibilitychange', () => { if (!document.hidden) dayTick(true); });

/* ==================== RELOJ ==================== */
let lastDay = todayStr(), lastHour = nowHour();
function dayTick(force) {
  const d = todayStr(), h = nowHour();
  if (d !== lastDay) {
    lastDay = d; lastHour = h;
    skipped.clear();
    CK.week = null;
    if (S.hard && S.hard !== d) S.hard = '';
    rollEvents(); persist();
    if (modal) staleUI = true; else refresh();
  } else if (h !== lastHour || force) {
    lastHour = h;
    if (modal) staleUI = true; else refresh();
  } else if (curTab === 'hoy') updateClock();
}
setInterval(dayTick, 30000);
setInterval(tickWork, 1000);

/* ==================== FONDO ==================== */
function startBackground() {
  const cv = $('#bg'), ctx = cv.getContext('2d', { alpha: false });
  const W = 192, H = 108;
  cv.width = W; cv.height = H;
  const img = ctx.createImageData(W, H), px = img.data;
  const PAL = ['#0b1410', '#13281d', '#1f3b2c', '#3b2a4d', '#5a3a22', '#2a5a4a'].map(h => [1, 3, 5].map(k => parseInt(h.slice(k, k + 2), 16)));
  const NP = PAL.length;
  let t = 0, last = 0;
  function paint() {
    let i = 0;
    for (let y = 0; y < H; y++) {
      const v = y / H - 0.5;
      for (let x = 0; x < W; x++) {
        const u = (x / W - 0.5) * 1.78, r = Math.sqrt(u * u + v * v), a = Math.atan2(v, u);
        let m = Math.sin(a * 3 - r * 8 + t) + 0.75 * Math.sin(a * 2 + r * 12 - t * 0.6) + 0.5 * Math.sin(u * 6 - t * 0.8) * Math.cos(v * 5 + t * 0.45);
        m += ((x * 7 + y * 13) % 5 - 2) * 0.05;
        let k = Math.floor((m + 2.4) / 4.8 * NP);
        k = k < 0 ? 0 : k >= NP ? NP - 1 : k;
        const c = PAL[k];
        px[i++] = c[0]; px[i++] = c[1]; px[i++] = c[2]; px[i++] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
  }
  paint();
  if (REDUCED) return;
  (function loop(now) {
    requestAnimationFrame(loop);
    if (document.hidden || now - last < 50) return;
    last = now; t += 0.035;
    paint();
  })(0);
}

/* ==================== ARRANQUE ==================== */
loadState();
ordSeq = Math.max(0, ...S.tasks.map(t => t.ord));
renderTitle();
rollEvents();
persist();
showTab('hoy');
startBackground();
if (!storageOk) toast('⚠️ Este navegador no está guardando tus datos. Descarga un respaldo en Ajustes antes de cerrar.');
if (!S.settings.onboarded) openOnboarding();
</script>

}
